<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="e45190ce4ac1b6996c256f7a4aabe20b">
  <title>Ask Chip</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="zoom">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="dropdown askchip-menu">
        <button id="menuAskChip" class="askchip-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="menuDropdown">
          <img src="/static/chip/img/chip.png" alt="" class="askchip-logo">
          <span class="askchip-text">AskChip</span>
          <span class="askchip-caret" aria-hidden="true">▾</span>
        </button>
        <div id="menuDropdown" class="dropdown-content hidden" role="menu" aria-labelledby="menuAskChip">
          <a id="menuAdmin" role="menuitem" href="/admin" style="display: none;">Admin</a>
          <a id="menuProfile" role="menuitem" href="#">Profile</a>
          <a id="menuLogout" role="menuitem" href="#">Logout</a>
        </div>
      </div>
    </div>
  </header>

  <main class="meeting-layout">
    <div class="meeting-grid">
      <aside class="chat-pane">
        <div class="pane-header">
          <h2>Chat</h2>
        </div>
        <div id="chatMessages" class="chat-window"><div data-role="assistant" data-turn-id="a31da2091c484c76b0232bc0441bb59d" class="msg assistant">Hey User, what outcome are you aiming for today?</div><div data-role="assistant" data-turn-id="20" class="msg assistant">I’m here to help!</div></div>
        <div class="composer">
          <input id="composer" placeholder="Type a message…" style="">
          <button id="composerSend">Send</button>
        </div>
      </aside>

      <section class="visualizer-pane">
        <div class="status-row">
          <span class="status-label">Status:</span>
          <span id="statusText">Listening…</span>
        <span id="userTranscriptPreview" class="asr-preview" aria-live="polite" style="display: none;"></span></div>
        <div class="visualizer-shell" role="img" aria-label="Audio visualizer">
          <div class="visualizer-backdrop">
            <canvas class="visualizer-waveform" role="presentation" width="354" height="239"></canvas>
          </div>
        </div>
      </section>

      <aside class="suggestions-pane">
        <h4>Suggestions</h4>
        <ul id="suggestions"><button class="chip" type="button">Show install steps</button><button class="chip" type="button">Explain the business value</button></ul>
      </aside>
    </div>

    <div class="meeting-toolbar">
      <div class="toolbar-buttons">
        <button id="startButton" class="primary" title="Please complete your profile to continue" disabled="">Start</button>
        <button id="endButton">End</button>
        <span id="stateDot" class="dot dot-ready" title="Ready"></span>
      </div>
    </div>
  </main>

  <!-- Login / Profile Modals -->
  <div id="loginModal" class="modal">
    <div class="sheet">
      <h3>Sign in</h3>
      <p>Login with your Trace3 or Pure email.</p>
      <form id="inlineLoginForm">
        <input id="inlineLoginEmail" type="email" placeholder="you@trace3.com or you@purestorage.com" style="">
        <div class="actions">
          <button id="inlineLoginSubmit" type="submit" class="primary">Sign in</button>
          <button id="inlineLoginCancel" type="button">Cancel</button>
        </div>
        <div id="inlineLoginMsg" class="msgline warn">No assistant frames after greet — check WS handler/payload.</div>
      </form>
    </div>
  </div>

  <div id="profileModal" class="modal hidden">
    <div class="sheet">
      <h3>Profile</h3>
      <div class="grid">
        <label>Name<input id="prof_name" style=""></label>
        <label>Email<input id="prof_email" disabled="" style=""></label>
        <label>Role<input id="prof_role" style=""></label>
        <label>Region<input id="prof_region" style=""></label>
        <label>Company<input id="prof_company" style=""></label>
      </div>
      <div class="actions">
        <button id="profileSave" class="primary">Save</button>
        <button id="profileCancel" type="button">Cancel</button>
      </div>
      <div id="profileMsg" class="msgline"></div>
    </div>
  </div>

  <!-- Scripts -->
  
  <script>
    window.__askchipAssetVersion = "1760317169";
  </script>
  <script type="module" src="/static/js/bootstrap.js?v=1760317169"></script>
  <script type="module" src="/static/js/auth_gate.js?v=1760317169"></script>
  <script type="module" src="/static/js/ui_menu.js?v=1760317169"></script>

</body></html>
