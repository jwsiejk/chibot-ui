services:
  - type: web
    name: ask-chip
    env: python
    plan: starter
    buildCommand: pip install -U pip setuptools wheel && pip install --prefer-binary -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w ${WEB_CONCURRENCY:-1} --bind 0.0.0.0:$PORT app.asgi_gateway:asgi
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
      - key: DATABASE_URL
      - key: OPENAI_API_KEY
      - key: OPENAI_MODEL
      - key: EMAIL_WEBHOOK_URL
      - key: EMAIL_WEBHOOK_SECRET
      - key: ELEVENLABS_API_KEY
      - key: ELEVEN_API_KEY
      - key: XI_API_KEY
      - key: ELEVENLABS_VOICE_ID
      - key: ELEVEN_VOICE_ID
      - key: CHIP_VOICE_ID
      - key: ELEVENLABS_MODEL_ID
      - key: ADMIN_EMAILS