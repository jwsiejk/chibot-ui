[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "askchip-api"
version = "0.1.0"
description = "Local-only AskChip API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "httpx>=0.28,<1.0",
  "faster-whisper>=1.1,<2.0",
  "kokoro-onnx>=0.4,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0"
]
gpu-tts = [
  "onnxruntime-gpu>=1.21,<2.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
