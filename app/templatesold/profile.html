<!doctype html><html><body><h1>Profile</h1><div id='msg'></div><form id='f'><label>Email</label><input id='email' readonly><label>Name</label><input id='name'><label>Title</label><input id='title'><label>Region</label><input id='region'><button type='submit'>Save</button></form><script>async function api(p,o){const r=await fetch(p,{credentials:'include',headers:{'Content-Type':'application/json','X-CSRF-Token':(window.csrfToken||'')},...(o||{})});return {ok:r.ok,status:r.status,json:await r.json().catch(()=>({}))}};const E=e=>document.getElementById(e);function msg(t){E('msg').innerHTML=t||''} (async()=>{const {ok,status,json}=await api('/api/v1/profile');if(!ok){msg(status===401?'Not signed in. <a href=/login>Sign in</a>.':'Error '+status);return;}const p=json.profile||{};E('email').value=p.email||'';E('name').value=p.name||'';E('title').value=p.title||'';E('region').value=p.region||'';window.profileComplete=!!p.profile_complete;})() ;document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const body=JSON.stringify({name:E('name').value.trim(),title:E('title').value.trim(),region:E('region').value.trim()});const {ok,status,json}=await api('/api/v1/profile',{method:'POST',body});if(!ok){msg('Save failed: '+(json.error||status));return;}msg('Saved.');window.profileComplete=!!(json.profile&&json.profile.profile_complete);});</script></body></html>
