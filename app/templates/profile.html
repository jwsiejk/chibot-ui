<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Profile</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    form { max-width: 520px; display:grid; gap:12px; }
    label { display:block; font-weight:600; }
    input, select, button { padding:8px 10px; font-size:16px; }
    .row { display:flex; gap:12px; }
    .grow { flex:1; }
    .muted { color:#666; }
    .error { color:#b00; }
    .ok { color:#060; }
    .card { border:1px solid #ddd; border-radius:10px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
    .actions { display:flex; gap:10px; align-items:center; }
    .disabled { opacity:.55; pointer-events:none; }
  </style>
</head>
<body>
  <h1>Your Profile</h1>
  <p class="muted">Please fill out your profile to continue. The <b>Start</b> button stays disabled until the profile is saved.</p>

  <div id="msg"></div>

  <div class="card">
    <form id="f">
      <div>
        <label>Email</label>
        <input id="email" type="email" readonly>
      </div>
      <div class="row">
        <div class="grow">
          <label>Name</label>
          <input id="name" placeholder="Your name">
        </div>
        <div class="grow">
          <label>Title</label>
          <input id="title" placeholder="Your title">
        </div>
      </div>
      <div>
        <label>Region</label>
        <input id="region" placeholder="e.g., US-East">
      </div>

      <div class="actions">
        <button id="save" type="submit">Save</button>
        <span id="status" class="muted"></span>
      </div>
    </form>
  </div>

  <script>
    async function api(path, opts={}){
      const r = await fetch(path, {credentials:'include', headers:{'Content-Type':'application/json','X-CSRF-Token': (window.csrfToken||'')}, ...opts});
      return {ok:r.ok, status:r.status, json: await r.json().catch(()=>({}))};
    }
    const emailEl = document.getElementById('email');
    const nameEl = document.getElementById('name');
    const titleEl = document.getElementById('title');
    const regionEl = document.getElementById('region');
    const statusEl = document.getElementById('status');
    const msgEl = document.getElementById('msg');
    const form = document.getElementById('f');

    function setMsg(text, cls){ msgEl.innerHTML = '<p class="'+cls+'">'+text+'</p>'; }

    // Load profile
    (async () => {
      const {ok, status, json} = await api('/api/v1/profile');
      if (!ok) {
        setMsg(status===401 ? 'Not signed in. Please sign in and reload.' : ('Error '+status), 'error');
        return;
      }
      const p = json.profile || {};
      emailEl.value = p.email || '';
      nameEl.value = p.name || '';
      titleEl.value = p.title || '';
      regionEl.value = p.region || '';
      statusEl.textContent = p.profile_complete ? 'Profile complete' : 'Please complete profile';
      window.profileComplete = !!p.profile_complete;
      window.dispatchEvent(new CustomEvent('profile_loaded', {detail:{complete:window.profileComplete}}));
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = JSON.stringify({
        name: nameEl.value.trim(),
        title: titleEl.value.trim(),
        region: regionEl.value.trim()
      });
      const {ok, status, json} = await api('/api/v1/profile', {method:'POST', body});
      if (!ok) { setMsg('Save failed: '+(json.error||status), 'error'); return; }
      const p = json.profile || {};
      statusEl.textContent = p.profile_complete ? 'Profile complete' : 'Please complete profile';
      window.profileComplete = !!p.profile_complete;
      setMsg('Saved.', 'ok');
      window.dispatchEvent(new CustomEvent('profile_saved', {detail:{complete:window.profileComplete}}));
    });
  </script>
</body>
</html>
