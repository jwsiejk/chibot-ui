<!doctype html>
<html><head><meta charset="utf-8"><title>Admin Live Log</title></head>
<body>
  <h1>Admin Live Log</h1>
  <pre id="out"></pre>
  <script>
    const out = document.getElementById('out');
    const params = new URLSearchParams(window.location.search);
    const targetSession = params.get('session_id') || params.get('sid') || '';
    if (targetSession) {
      out.textContent = `Filtering to session_id=${targetSession}\n`;
    }
    const es = new EventSource('/api/v1/admin/logs');
    es.addEventListener('heartbeat', e => {
      if (!targetSession) {
        out.textContent += e.data + "\n";
      }
    });
    es.onmessage = e => {
      const raw = e.data || '';
      try {
        const payload = JSON.parse(raw);
        const sid = payload.session_id || payload.sid;
        if (targetSession && sid !== targetSession) {
          return;
        }
        out.textContent += JSON.stringify(payload) + "\n";
      } catch (err) {
        if (!targetSession) {
          out.textContent += raw + "\n";
        }
      }
      out.scrollTop = out.scrollHeight;
    };
  </script>
</body></html>
