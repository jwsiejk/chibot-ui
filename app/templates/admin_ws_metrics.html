<!doctype html>
<html><head><meta charset="utf-8"><title>Admin — WS Metrics</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:20px;}
    .stat{display:inline-block;margin:6px 12px;padding:8px 12px;border-radius:8px;background:#f3f4f6}
    table{border-collapse:collapse;margin-top:12px;width:520px;}
    th,td{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;}
    th{background:#f9fafb}
  </style>
</head>
<body>
  <h1>WebSocket Auth Metrics</h1>
  <div id="stats">
    <span class="stat">Total fails: <b id="total_fails">–</b></span>
    <span class="stat">Over-limit: <b id="overlimit_fails">–</b></span>
    <span class="stat">Limit: <b id="fail_limit">–</b> in <b id="fail_window_sec">–</b>s</span>
    <span class="stat">Bearer-only: <b id="bearer_only">–</b></span>
  </div>
  <h3>Failures by IP (current window)</h3>
  <table>
    <thead><tr><th>IP</th><th>Count</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <script>
    async function refresh(){
      try{
        const r = await fetch('/api/v1/metrics');
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j = await r.json();
        const ws = j.ws || {};
        total_fails.textContent = ws.total_fails ?? 0;
        overlimit_fails.textContent = ws.overlimit_fails ?? 0;
        fail_limit.textContent = ws.fail_limit ?? '?';
        fail_window_sec.textContent = ws.fail_window_sec ?? '?';
        bearer_only.textContent = (ws.bearer_only == "1") ? 'Yes' : 'No';
        const ips = ws.ip_buckets || {};
        tbody.innerHTML = '';
        Object.keys(ips).sort().forEach(ip => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${ip}</td><td>${ips[ip]}</td>`;
          tbody.appendChild(tr);
        });
      }catch(e){ console.error(e); }
    }
    refresh(); setInterval(refresh, 5000);
  </script>
</body></html>
