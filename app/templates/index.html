<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskChip — Live</title>
  <meta name="color-scheme" content="dark light">
  <meta name="askchip-env" content="{{ ASKCHIP_ENV|default('prod') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .dev-inspector-toggle {
      position: fixed;
      right: 24px;
      bottom: 96px;
      z-index: 190;
      padding: 8px 14px;
      font-size: 12px;
      line-height: 1.2;
    }

    .dev-inspector {
      position: fixed;
      right: 24px;
      bottom: 168px;
      width: min(420px, calc(100% - 48px));
      max-height: calc(100vh - 220px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(10, 14, 24, 0.96), rgba(8, 12, 20, 0.94));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 185;
    }

    .dev-inspector__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .dev-inspector__title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .dev-inspector__sid {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }

    .dev-inspector__actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dev-inspector__action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: background .2s ease;
    }

    .dev-inspector__action:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .dev-inspector__action[aria-disabled="true"] {
      opacity: .4;
      pointer-events: none;
    }

    .dev-inspector__output {
      margin: 0;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.32);
      color: var(--text);
      font-size: 12px;
      line-height: 1.45;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "JetBrains Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .dev-inspector__message {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body data-askchip-env="{{ ASKCHIP_ENV|default('prod') }}">
  <div id="toast-root" class="toast-container" aria-live="assertive" aria-atomic="true"></div>
  <div id="app" class="app">
    <!-- Top Bar -->
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <span class="env-badge" title="Environment">LIVE</span>
        <span class="sid" aria-live="polite" aria-atomic="true" title="Session ID">SID: <span id="sid-text">—</span></span>
      </div>
      <div class="topbar-right">
        <div class="brand-menu">
          <button id="brandBtn" class="brand-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="brandMenu">
            <span class="brand-text">AskChip</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
          </button>
          <div id="brandMenu" class="menu" role="menu" aria-labelledby="brandBtn">
            <button class="menu-item" role="menuitem" id="adminItem" aria-disabled="false">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2l4 2 4 2-4 2-4 2-4-2-4-2 4-2 4-2zm0 6l4 2 4 2-4 2-4 2-4-2-4-2 4-2 4-2zm0 6l4 2 4 2-4 2-4 2-4-2-4-2 4-2 4-2z"/></svg>
              <span>Admin</span>
            </button>
            <button class="menu-item" role="menuitem" id="profileItem">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
              <span>Profile</span>
            </button>
            <button class="menu-item" role="menuitem" id="logoutItem">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-8v2h8v14h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Layout -->
    <main class="layout" role="main">
      <!-- Center Stage (Zoom-like "Chip window") -->
      <section class="stage" aria-label="Chip window">
        <div class="chip-window">
          <canvas id="waveCanvas" class="wave-canvas" aria-hidden="true"></canvas>
          <div class="chip-overlay">
            <div class="chip-status" role="status" aria-live="polite" aria-atomic="true">
              <span class="status-dot on"></span>
              <span id="connLabel">Connected</span>
            </div>
            <div class="voice-chip" role="status" aria-live="polite" aria-atomic="true">
              <span class="chip-label">Voice</span>
              <span id="voiceLabel">—</span>
              <span class="sep" aria-hidden="true">•</span>
              <span class="chip-label">Locale</span>
              <span id="localeLabel">—</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Chat Panel -->
      <aside class="chat" aria-label="Conversation">
        <header class="chat-header">
          <h2>Conversation</h2>
        </header>
        <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Conversation transcript">
          <div class="msg assistant">
            <div class="bubble">
              <p>Welcome to AskChip. Tap <strong>Start</strong> below to begin.</p>
            </div>
            <div class="meta">assistant · now</div>
          </div>
        </div>
      </aside>
    </main>

    <!-- Bottom Toolbar -->
    <footer class="toolbar" role="contentinfo">
      <div class="toolbar-left">
        <button class="pill secondary" id="openChatBtn" aria-pressed="false" title="Toggle Chat Panel">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2z"/></svg>
          Chat
        </button>
      </div>
      <div class="toolbar-center">
        <button class="pill start" id="startBtn" aria-label="Start session">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          Start
        </button>
        <button class="pill end" id="endBtn" aria-label="End session" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
          End
        </button>
      </div>
      <div class="toolbar-right">
        <form id="textChatForm" class="text-chat" autocomplete="off" style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="textChatInput" name="textChatInput" placeholder="Type to interrupt…" aria-label="Send a message" style="flex:1; min-width:160px; padding:8px 12px; border-radius:12px; border:1px solid var(--border); background:rgba(0,0,0,0.35); color:var(--text);" />
          <button type="submit" class="pill secondary" id="textChatSendBtn">Send</button>
        </form>        
        <span class="latency" id="latencyHint" role="status" aria-live="polite" aria-atomic="true">Latency: —</span>
      </div>
    </footer>
  </div>

  <button id="devInspectorToggle" class="pill secondary dev-inspector-toggle" type="button" hidden aria-haspopup="true" aria-expanded="false" aria-controls="devInspectorPanel">
    Inspector
  </button>
  <section id="devInspectorPanel" class="dev-inspector" role="region" aria-label="Dev inspector" hidden>
    <header class="dev-inspector__header">
      <div>
        <span class="dev-inspector__title">Flow Inspector</span>
        <span id="devInspectorSid" class="dev-inspector__sid">SID: —</span>
      </div>
      <div class="dev-inspector__actions">
        <button id="devInspectorRefresh" type="button" class="dev-inspector__action">Refresh</button>
        <a id="devInspectorDownload" class="dev-inspector__action" href="#" aria-disabled="true">Download export</a>
        <button id="devInspectorClose" type="button" class="dev-inspector__action">Close</button>
      </div>
    </header>
    <pre id="devInspectorOutput" class="dev-inspector__output" aria-live="polite"></pre>
    <p id="devInspectorStatus" class="dev-inspector__message">Connect to capture flow events.</p>
  </section>

  <script src="./transcript_view.js"></script>
  <script src="./errors.js"></script>
  <script src="./app.js"></script>
</body>
</html>
