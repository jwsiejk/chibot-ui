<!doctype html>
<html lang="en" data-askchip-env="development">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="askchip-env" content="development" />
    <title>AskChip UI</title>
    <link rel="icon" href="/static/favicon.ico" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body data-askchip-env="development">
    <div id="app">
      <header class="topbar" role="banner">
        <div class="topbar-left">
          <span class="env-badge" aria-label="Environment">Development</span>
          <span class="sid" id="sid-text">SID: —</span>
        </div>
        <div class="topbar-right">
          <div class="brand-menu">
            <button
              id="brandBtn"
              class="brand-btn"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <span class="brand-text">AskChip</span>
              <span aria-hidden="true">▾</span>
            </button>
            <div id="brandMenu" class="menu" role="menu" aria-hidden="true">
              <button id="profileItem" class="menu-item" type="button" role="menuitem">Profile</button>
              <button id="adminItem" class="menu-item" type="button" role="menuitem">Admin UI</button>
              <button id="logoutItem" class="menu-item" type="button" role="menuitem">Sign out</button>
            </div>
          </div>
        </div>
      </header>

      <main class="layout" role="main">
        <section class="stage" aria-labelledby="connLabel">
          <div class="chip-window">
            <canvas
              id="waveCanvas"
              class="wave-canvas"
              role="img"
              aria-label="Live audio visualization"
            ></canvas>
            <div class="chip-overlay">
              <div class="chip-status" role="status" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="connLabel">Disconnected</span>
              </div>
              <div
                id="modeSuggestions"
                class="mode-suggestions hidden"
                role="region"
                aria-live="polite"
              >
                <div id="modeSuggestionsLabel" class="mode-suggestions__label"></div>
                <div id="modeSuggestionsChips" class="mode-suggestions__chips" role="list"></div>
              </div>
              <div class="voice-chip" aria-live="polite">
                <span class="chip-label">Voice</span>
                <span id="voiceLabel">—</span>
                <span class="sep" aria-hidden="true">•</span>
                <span class="chip-label">Locale</span>
                <span id="localeLabel">en-US</span>
              </div>
            </div>
          </div>
        </section>

        <section class="chat" aria-label="Conversation transcript">
          <header class="chat-header">
            <h2>Session transcript</h2>
          </header>
          <div
            id="messages"
            class="messages"
            role="log"
            aria-live="polite"
            aria-relevant="additions text"
          ></div>
          <footer class="toolbar">
            <div class="toolbar-left">
              <button id="openChatBtn" class="pill secondary" type="button">Pop out</button>
            </div>
            <div class="toolbar-center">
              <button id="startBtn" class="pill start" type="button">Start session</button>
              <button id="endBtn" class="pill end" type="button" disabled>End session</button>
            </div>
            <div class="toolbar-right" id="latencyHint">Latency: —</div>
          </footer>
          <form id="textChatForm" class="text-chat-form" autocomplete="off">
            <label for="textChatInput" class="visually-hidden">Send a chat message</label>
            <input
              id="textChatInput"
              type="text"
              name="message"
              placeholder="Type a message to the assistant…"
              aria-label="Send a chat message"
            />
          </form>
        </section>
      </main>

      <section class="dev-tools">
        <button id="devInspectorToggle" class="pill secondary" type="button" hidden>
          Flow inspector
        </button>
        <div id="devInspectorPanel" class="dev-inspector" hidden aria-hidden="true">
          <header class="dev-inspector__header">
            <h3>Flow inspector</h3>
            <div class="dev-inspector__actions">
              <button id="devInspectorRefresh" type="button">Refresh</button>
              <button id="devInspectorClose" type="button">Close</button>
            </div>
          </header>
          <p id="devInspectorSid">SID: —</p>
          <p id="devInspectorStatus">Connect to capture flow events.</p>
          <pre id="devInspectorOutput" aria-live="polite"></pre>
          <a
            id="devInspectorDownload"
            href="#"
            aria-disabled="true"
            tabindex="-1"
          >
            Download flow.zip
          </a>
        </div>
      </section>
    </div>

    <div id="toast-root" class="toast-container" aria-live="polite"></div>
    <div id="wserror-banner-root" aria-live="assertive"></div>

    <script src="/static/js/app.js" defer></script>
  </body>
</html>
