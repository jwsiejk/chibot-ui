<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ask Chip Diagnostics</title>
<script>window.__ASKCHIP_API_ORIGIN='';</script>
<script src="/static/js/api-smart-shim.js"></script>
<style>body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:24px} .ok{color:#0a7f2e;font-weight:600} .fail{color:#b00020;font-weight:600} code{background:#f5f5f7;padding:2px 6px;border-radius:4px} table{border-collapse:collapse;width:100%;margin-top:12px} th,td{border:1px solid #ddd;padding:8px} th{background:#fafafa;text-align:left} .small{font-size:12px;color:#555}</style>
</head><body><h1>Ask Chip Diagnostics</h1>
<table><thead><tr><th>Check</th><th>Endpoint</th><th>Status</th><th>Details</th></tr></thead><tbody id="tbody"></tbody></table>
<script type="module">
const tests=[
 {name:'Health',path:'/api/health'},
 {name:'Health (alt)',path:'/health'},
 {name:'Session: me',path:'/api/me'},
 {name:'Login (OPTIONS)',path:'/api/login',options:{method:'OPTIONS'}},
 {name:'Voice Health',path:'/api/voice/health'}
];
const tbody=document.getElementById('tbody');
async function run(t){const tr=document.createElement('tr');tr.innerHTML=`<td>${t.name}</td><td><code>${t.path}</code></td><td>...</td><td class="small"></td>`;tbody.appendChild(tr);let text='';try{const res=await fetch(t.path,{credentials:'include',...(t.options||{})});const ct=res.headers.get('content-type')||'';text=ct.includes('application/json')?JSON.stringify(await res.json()):await res.text();tr.children[2].innerHTML=res.ok?`<span class="ok">OK ${res.status}</span>`:`<span class="fail">HTTP ${res.status}</span>`;}catch(e){tr.children[2].innerHTML=`<span class="fail">Network error</span>`;text=String(e&&e.message||e);}tr.children[3].textContent=(text||'').slice(0,2000);} for(const t of tests) run(t);
</script></body></html>
