<!doctype html>
<meta charset="utf-8"/>
<title>Ask Chip — Admin Log (Static Tool)</title>
<style>
  :root { --bg:#0f1115; --ink:#eaeef2; --box:#0a0c10; --line:#222; --mut:#8b949e; --ok:#7ee787; --bad:#ff7b72; }
  body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);margin:0}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  main{padding:12px 16px}
  .status{font-size:12px;opacity:.85}
  .pill{padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--mut)}
  pre{background:var(--box);border:1px solid var(--line);padding:12px;border-radius:8px;max-height:72vh;overflow:auto}
  small{opacity:.7}
  a{color:#7cb1ff}
</style>
<header>
  <strong>Admin Log (Static Tool)</strong>
  <span class="status" id="status">connecting…</span>
  <span class="pill" id="endpoint"></span>
</header>
<main>
  <pre id="log"></pre>
  <p><small>Streaming from <code>/api/v1/admin/logs</code>. This page does not require auth but uses your current session.</small></p>
</main>
<script>
(function(){
  const LOG_URL = "/api/v1/admin/logs?history=50";
  const out = document.getElementById("log");
  const status = document.getElementById("status");
  const ep = document.getElementById("endpoint");
  let es = null, retry = 1500;

  function line(s){ out.textContent += s + "\n"; out.scrollTop = out.scrollHeight; }

  function attach(){
    ep.textContent = LOG_URL;
    try { if (es) es.close(); } catch {}
    es = new EventSource(LOG_URL);
    status.textContent = "connected";
    es.onmessage = (ev) => {
      try{
        const obj = JSON.parse(ev.data);
        line(new Date().toISOString() + "  " + JSON.stringify(obj));
      }catch(_){
        line("! bad event: " + ev.data);
      }
    };
    es.onerror = () => {
      status.textContent = "disconnected — retrying…";
      try { es.close(); } catch {}
      setTimeout(()=>{ warm().finally(attach); }, retry);
      retry = Math.min(retry * 2, 8000); // backoff up to 8s
    };
  }

  function warm(){ // avoid initial hibernation 503
    return fetch("/api/health").catch(()=>{});
  }

  // warm first, then attach; EventSource will autoretry too
  warm().finally(attach);
})();
</script>
