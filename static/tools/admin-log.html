<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Log (SSE)</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#0f1115;color:#e6e9ef}
    header{padding:10px 14px;border-bottom:1px solid #222531} h1{margin:0;font-size:16px}
    main{padding:10px 14px}
    pre{background:#121621;border:1px solid #1d2230;border-radius:10px;padding:10px;height:70vh;overflow:auto;white-space:pre-wrap}
    .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    input{padding:6px 8px;border-radius:8px;border:1px solid #2a2f42;background:#0f1115;color:#e6e9ef;min-width:200px}
    button{padding:6px 10px;border-radius:8px;border:1px solid #2a2f42;background:#1c2233;color:#e6e9ef;cursor:pointer}
  </style>
</head>
<body>
  <header><h1>Admin Log — SSE Stream</h1></header>
  <main>
    <div class="row">
      <input id="f" placeholder="filter…"><button id="clear">Clear</button><span id="status"></span>
    </div>
    <pre id="out">(connecting…)</pre>
  </main>
  <script>
    const out=document.getElementById('out'), f=document.getElementById('f'), st=document.getElementById('status');
    document.getElementById('clear').addEventListener('click',()=>{ out.textContent=''; });
    try{
      const es = new EventSource('/api/v1/admin/logs');
      es.onopen = ()=>{ st.textContent='connected'; };
      es.onmessage = (ev)=>{
        const line = ev.data||'';
        const filter = (f.value||'').toLowerCase();
        if (!filter || line.toLowerCase().includes(filter)){
          out.textContent += line + '\n';
          out.scrollTop = out.scrollHeight;
        }
      };
      es.addEventListener('ping', ()=>{ st.textContent='ok'; });
      es.onerror = ()=>{ st.textContent='disconnected'; };
    }catch(e){
      st.textContent = String(e.message||e);
    }
  </script>
</body>
</html>
