<!doctype html>
<meta charset="utf-8"/>
<title>Ask Chip — Admin Log (Static Tool)</title>
<style>
body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#0f1115;color:#eaeef2;margin:0}
header{padding:12px 16px;border-bottom:1px solid #222}
main{padding:12px 16px}
.status{font-size:12px;opacity:.8}
pre{background:#0a0c10;border:1px solid #222;padding:12px;border-radius:8px;max-height:72vh;overflow:auto}
small{opacity:.7}
a{color:#7cb1ff}
</style>
<header>
  <strong>Admin Log (Static Tool)</strong>
  <span class="status" id="status">connecting…</span>
</header>
<main>
  <pre id="log"></pre>
  <p><small>Tries <code>/admin/stream</code> then <code>/api/admin/stream</code>.</small></p>
</main>
<script>
(function(){
  const out = document.getElementById('log');
  const status = document.getElementById('status');
  function line(s){ out.textContent += s + "\\n"; out.scrollTop = out.scrollHeight; }
  function connect(path){
    const es = new EventSource(path);
    status.textContent = 'connected to ' + path;
    es.onmessage = (ev)=>{
      try{
        const obj = JSON.parse(ev.data);
        line(new Date().toISOString() + '  ' + JSON.stringify(obj));
      }catch(e){ line('! bad event: ' + ev.data); }
    };
    es.onerror = ()=>{ status.textContent = 'disconnected'; es.close(); fallback(path); };
  }
  function fallback(prev){
    if (prev === '/admin/stream'){ setTimeout(()=>connect('/api/admin/stream'), 800); }
    else { status.textContent = 'disconnected (both paths failed)'; }
  }
  connect('/admin/stream');
})();
</script>
