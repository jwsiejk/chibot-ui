<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Log (JSON feed)</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#0f1115;color:#e6e9ef}
    header{padding:10px 14px;border-bottom:1px solid #222531} h1{margin:0;font-size:16px}
    main{padding:10px 14px}
    pre{background:#121621;border:1px solid #1d2230;border-radius:10px;padding:10px;height:70vh;overflow:auto;white-space:pre-wrap}
    .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    input{padding:6px 8px;border-radius:8px;border:1px solid #2a2f42;background:#0f1115;color:#e6e9ef;min-width:200px}
    button{padding:6px 10px;border-radius:8px;border:1px solid #2a2f42;background:#1c2233;color:#e6e9ef;cursor:pointer}
  </style>
</head>
<body>
  <header><h1>Admin Log — Live Feed</h1></header>
  <main>
    <div class="row">
      <input id="f" placeholder="filter…"><button id="clear">Clear</button><span id="status"></span>
    </div>
    <pre id="out">(connecting…)</pre>
  </main>
  <script>
    const out=document.getElementById('out'), f=document.getElementById('f'), st=document.getElementById('status');
    document.getElementById('clear').addEventListener('click',()=>{ out.textContent=''; lastStep = 0; });
    f.addEventListener('input', ()=>{ lastStep = 0; out.textContent=''; });
    let lastStep = 0;
    async function poll(){
      const params = new URLSearchParams();
      if (lastStep) params.set('after', String(lastStep));
      const url = params.toString() ? `/api/v1/admin/logs?${params.toString()}` : '/api/v1/admin/logs';
      try {
        const resp = await fetch(url, { credentials:'include' });
        if (resp.status === 403) { st.textContent = 'forbidden'; return 5000; }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const payload = await resp.json();
        const events = Array.isArray(payload?.events) ? payload.events : [];
        if (!events.length && !lastStep) lastStep = Number(payload?.latest_step || 0) || 0;
        const filter = (f.value||'').toLowerCase();
        for (const evt of events){
          const step = Number(evt?.step || 0);
          if (step > lastStep) lastStep = step;
          const line = JSON.stringify(evt);
          if (!filter || line.toLowerCase().includes(filter)){
            out.textContent += line + '\n';
          }
        }
        if (events.length){ st.textContent='connected'; out.scrollTop = out.scrollHeight; }
        return events.length ? 250 : 1200;
      } catch(err){
        st.textContent = 'error';
        out.textContent += `poll error: ${err?.message || err}\n`;
        return 2000;
      }
    }

    (async function loop(){
      while(true){
        const delayMs = await poll();
        await new Promise(r => setTimeout(r, delayMs || 900));
      }
    })();
  </script>
</body>
</html>
