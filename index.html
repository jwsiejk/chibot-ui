<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask Chip</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='user-experience/css/style.css') }}">
  <script defer src="{{ url_for('static', filename='user-experience/js/main.js') }}"></script>
</head>
<body>

  <!-- Login Modal -->
  <div id="loginContainer" class="modal center">
    <form id="basicLoginForm" class="modal-content">
      <h2>Welcome to Ask Chip</h2>
      <label for="loginName">Email:</label>
      <input type="email" id="loginName" required placeholder="yourname@trace3.com or purestorage.com">
      <button type="submit">Login</button>
      <div id="loginStatus"></div>
      <div class="login-hint">Sign in with your Trace3 or Pure Storage email address</div>
    </form>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal bottom-right">
    <form class="modal-content small">
      <h3>Please fill out your profile to continue</h3>
      <label for="profileName">Name:</label>
      <input type="text" id="profileName" required>
      <label for="profileTitle">Title:</label>
      <input type="text" id="profileTitle" required>
      <button type="button" onclick="saveProfile()">Save</button>
    </form>
  </div>

  <!-- Chip Image -->
  <div class="chip-box">
    <img id="chipImage" src="{{ url_for('static', filename='chip/img/chip.png') }}" alt="Chip">
  </div>

  <!-- Session UI -->
  <canvas id="waveform"></canvas>
  <div id="recordPrompt" class="idle">Ask me anything</div>
  <div id="caption"></div>
  <button id="recordBtn">🎙️ Talk to Chip</button>

  <!-- Toolbar -->
  <div id="askChipToolbar">
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
    <button id="profileBtn">Profile</button>
    <div class="dropdown">
      <button>Options ▾</button>
      <div class="dropdown-content">
        <div id="feedbackOption">Send Feedback</div>
        <div id="helpOption">Help</div>
      </div>
    </div>
  </div>

  <div id="status">Loading Chip...</div>
  <div id="version-tag">v1.0</div>
</body>
</html>
