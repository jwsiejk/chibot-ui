name: Verify

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  verify:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest
      - name: Generate wiring report
        run: |
          python .tools/generate_wiring_report.py .
      - name: Check wiring snapshot committed
        run: |
          if ! git diff --exit-code wiring/; then
            echo "::error::Wiring report changed. Commit wiring/* or reconcile FE/BE." && exit 1
          fi
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q
