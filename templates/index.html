<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf" content="" />
  <title>Ask Chip</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="zoom">
  <header class="topbar">
    <div class="brand">AskChip</div>
    <div class="menu-wrap">
      <button id="startButton" class="primary">Start</button>
      <button id="endButton" disabled>End</button>
      <span id="stateDot" class="dot dot-ready" title="Ready"></span>
      <button id="menuBtn" class="ghost">AskChip ▾</button>
    </div>
  </header>

  <main class="zoom-grid">
    <section class="video-pane">
      <div class="chip-face">
        <div class="status-row">
          <span class="status-label">Status:</span>
          <span id="statusText">Ready</span>
        </div>
        <div id="chatMessages" class="chat"></div>
      </div>
      <div class="composer">
        <input id="composer" placeholder="Type a message…" />
        <button id="composerSend">Send</button>
      </div>
    </section>
    <aside class="side-pane">
      <h4>Suggestions</h4>
      <ul id="sugg"></ul>
    </aside>
  </main>

  <!-- Login / Profile Modals -->
  <div id="loginModal" class="modal hidden">
    <div class="sheet">
      <h3>Sign in</h3>
      <p>Login with your Trace3 or Pure email.</p>
      <form id="inlineLoginForm">
        <input id="inlineLoginEmail" type="email" placeholder="you@trace3.com or you@purestorage.com" />
        <div class="actions">
          <button id="inlineLoginSubmit" type="submit" class="primary">Sign in</button>
          <button id="inlineLoginCancel" type="button">Cancel</button>
        </div>
        <div id="inlineLoginMsg" class="msgline"></div>
      </form>
    </div>
  </div>

  <div id="profileModal" class="modal hidden">
    <div class="sheet">
      <h3>Profile</h3>
      <div class="grid">
        <label>Name<input id="prof_name"/></label>
        <label>Email<input id="prof_email" disabled/></label>
        <label>Role<input id="prof_role"/></label>
        <label>Region<input id="prof_region"/></label>
        <label>Company<input id="prof_company"/></label>
      </div>
      <div class="actions">
        <button id="profileSave" class="primary">Save</button>
        <button id="profileCancel" type="button">Cancel</button>
      </div>
      <div id="profileMsg" class="msgline"></div>
    </div>
  </div>

  <!-- Scripts --><!-- AskChip bootstrap: tokenized WS open + deterministic greet -->


  <script type="module" src="/static/js/bootstrap.js?v=v20250911b"></script>
  <script type="module" src="/static/js/auth_gate.js"></script>
</body>
</html>
