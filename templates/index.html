<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask Chip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />

  <!-- Temporary inline styles (safe to remove later) -->
  <style>
    :root { --bg:#0f1115; --panel:#181b22; --panel-2:#1f2430; --text:#e8ecf1; --muted:#a7b0bd; --accent:#ff6a00; --accent-2:#ff9350; --border:#2a3040; }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:linear-gradient(180deg,#0f1115 0%,#0d1014 100%);color:var(--text)}
    #app{max-width:1100px;margin:40px auto;padding:0 16px}
    h1{font-weight:650;letter-spacing:.2px;margin:0 0 16px}
    #status{margin:8px 0 16px;color:var(--muted);font-size:14px;min-height:18px}

    button,.btn{appearance:none;border:1px solid var(--border);background:linear-gradient(180deg,var(--panel-2),var(--panel));color:var(--text);padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;transition:transform .06s,box-shadow .06s,border-color .2s;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 8px 24px rgba(0,0,0,.35)}
    button:hover{transform:translateY(-1px);border-color:#36415a}
    button:disabled{opacity:.55;cursor:not-allowed;transform:none}
    #startButton{background:linear-gradient(180deg,var(--accent),var(--accent-2));border:none;color:#111;box-shadow:0 8px 30px rgba(255,106,0,.25)}

    input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);outline:none}
    input::placeholder{color:#8f98a6}

    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal .modal-content{width:100%;max-width:440px;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.45)}
    .modal h2{margin:0 0 8px;font-size:20px}
    .modal p.hint{margin:4px 0 12px;color:var(--muted);font-size:14px}
    .stack{display:grid;gap:10px}

    #chatArea{margin-top:20px;border:1px dashed #2a3040;border-radius:12px;min-height:220px;padding:16px;background:rgba(31,36,48,.4)}
  </style>

  <!-- Cache-busted script include -->
  <script src="/static/user-experience/js/main.js?v=20250809d" defer></script>
</head>
<body>
  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Welcome to Ask Chip</h2>
      <p id="loginHint" class="hint"></p>
      <form id="loginForm" class="stack">
        <input type="email" name="email" placeholder="Email address" required />
        <!-- password stays visible but disabled for preview -->
        <input type="password" name="password" placeholder="Password (disabled for preview)" disabled aria-disabled="true" />
        <small style="display:block;margin-top:6px;opacity:.7">
          Password is disabled for this preview. Use your Trace3 or Pure Storage email address.
        </small>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h2>Complete Your Profile</h2>
      <p id="profileHint" class="hint"></p>
      <form id="profileForm" class="stack">
        <input type="text"   name="name"   placeholder="Full name" required />
        <input type="text"   name="title"  placeholder="Title" />
        <input type="text"   name="role"   placeholder="Role" />
        <input type="text"   name="region" placeholder="Region" />
      </form>
      <button id="saveProfileBtn" class="btn" style="margin-top:10px;">Save</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="app">
    <h1>Ask Chip</h1>
    <div id="status"></div>
    <button id="startButton" class="btn" data-role="start">Start</button>
    <div id="chatArea"></div>
  </div>

  <!-- Pre-guard so older bundles can’t crash on .disabled -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    try {
      const sb = document.getElementById('startButton')
               || document.getElementById('startBtn')
               || document.querySelector('[data-role="start"]');
      if (sb && 'disabled' in sb) sb.disabled = true;
    } catch (e) {}
  });
  </script>

  <!-- Resilient boot: show login/profile/app based on /api/me -->
  <script>
  (async function bootAuth() {
    const q = s => document.querySelector(s);
    const loginEl   = q('#loginModal') || q('#login-panel') || q('[data-role="login-panel"]');
    const profileEl = q('#profileModal') || q('#profile-panel') || q('[data-role="profile-panel"]');
    const appEl     = q('#app') || q('#root');
    const startBtn  = q('#startButton') || q('#startBtn') || q('[data-role="start"]');

    function show(el){ if(el){ el.removeAttribute('hidden'); el.style.display='block'; } }
    function hide(el){ if(el){ el.setAttribute('hidden',''); el.style.display='none'; } }

    try {
      const r = await fetch('/api/me', { credentials: 'include' });
      if (!r.ok) { hide(appEl); hide(profileEl); show(loginEl); return; }

      const me = await r.json();
      if (!me.profileComplete) {
        hide(appEl); hide(loginEl); show(profileEl);
        if (startBtn) startBtn.disabled = true;
        return;
      }
      hide(loginEl); hide(profileEl); show(appEl);
      if (startBtn) startBtn.disabled = false;
    } catch {
      hide(appEl); hide(profileEl); show(loginEl);
    }
  })();
  </script>
</body>
</html>
