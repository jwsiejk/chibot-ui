  <script>
/* Ask Chip hotfix: force a stable /api/chat contract */
window.API = window.API || {};
window.API.chat = async function(prompt) {
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }) // also accepted by the server: message | text
    });
    let json;
    try { json = await res.json(); } catch { return { ok: false, error: "bad_json" }; }
    if (json && typeof json.ok === "boolean") return json;
    return { ok: false, error: "bad_shape", status: res.status, body: json };
  } catch (e) {
    return { ok: false, error: "exception", detail: String(e) };
  }
};

// Optional: show config status in the console to help debugging
fetch("/api/health").then(r=>r.json()).then(s=>console.info("[AskChip] health", s)).catch(()=>{});
</script>


  <!-- Orchestrator shim: prefer /api/chat (memory + style), else fall back -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!window.API || typeof API.chat !== 'function') return;
    const legacyChat = API.chat.bind(API);
    API.chat = async function (text) {
      try {
        const r = await fetch('/api/orchestrator', { method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (r.status !== 404) {
          const j = await r.json();
          if (j && j.ok) return { ok: true, reply: j.reply, state: j.state };
          return { ok: false, error: (j && j.error) || 'orchestrator error' };
        }
      } catch (e) {}
      return legacyChat(text);
    };
  });
</script>
<audio id="chipAudio" hidden></audio>

<script>
// Open SSE stream for chat; return a Promise that resolves with the full reply
function startStream(text) {
  return new Promise((resolve) => {
    const esc = encodeURIComponent(text || "");
    const es = new EventSource(`/api/chat/stream?q=${esc}`);
    let buf = "";

    es.addEventListener("token", (ev) => {
      try { const d = JSON.parse(ev.data); if (d && d.delta) { buf += d.delta; } } catch {}
      // TODO: optionally render live text buf into the UI
    });
    es.addEventListener("tool_call", (ev) => {
      // Optionally surface "Using tool ..." in the UI
      // console.log("tool_call", ev.data);
    });
    es.addEventListener("tool_result", (ev) => {
      // Optionally surface tool result/confirmation
      // console.log("tool_result", ev.data);
    });
    es.addEventListener("interrupted", () => {
      es.close(); resolve({ ok: false, interrupted: true, reply: buf.trim() });
    });
    es.addEventListener("done", async () => {
      es.close();
      resolve({ ok: true, reply: buf.trim() });
    });
    es.onerror = () => { try { es.close(); } catch {} resolve({ ok:false, error:"stream_error", reply: buf.trim() }); };
  });
}
</script>


<style>
#adminLogPanel{position:fixed; right:16px; bottom:16px; width:420px; max-height:55vh; background:var(--panel);
  border:1px solid var(--border); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden; z-index:30;}
#adminLogPanel header{display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:rgba(255,255,255,0.03); border-bottom:1px solid var(--border);}
#adminLogPanel header .controls button{margin-left:8px;}
#adminLogBody{padding:8px 10px; overflow:auto; font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap;}
.log-row{border-bottom:1px dashed var(--border); padding:6px 0;}
.log-row .meta{opacity:0.7;}
</style>

<script>
(async function initAdminLog(){
  let isAdmin = false;
  try {
    const r = await fetch('/api/health', {credentials:'include'});
    const j = await r.json();
    isAdmin = !!j.is_admin;
  } catch (e) { isAdmin = false; }
  const btn = document.getElementById('adminLogBtn');
  const panel = document.getElementById('adminLogPanel');
  const body = document.getElementById('adminLogBody');
  const refresh = document.getElementById('adminRefresh');
  const clearBtn = document.getElementById('adminClear');
  const closeBtn = document.getElementById('adminClose');
  if (!btn || !panel) return;
  if (!isAdmin) return;

  btn.hidden = false;
  btn.addEventListener('click', async ()=>{
    panel.hidden = false;
    await refreshLogs();
  });
  closeBtn.addEventListener('click', ()=>{ panel.hidden = true; });

  async function fetchLogs() {
    const r = await fetch('/api/admin/calls/recent?limit=200', {credentials:'include'});
    if (!r.ok) return [];
    const j = await r.json();
    return (j && j.events) || [];
  }

  function render(evs) {
    body.innerHTML = '';
    for (const ev of evs.slice().reverse()) {
      const ts = new Date(ev.ts*1000).toLocaleTimeString();
      const meta = [ts, ev.kind, ev.route || ''].filter(Boolean).join(' · ');
      const fields = ev.fields ? JSON.stringify(ev.fields, null, 0) : '';
      const row = document.createElement('div');
      row.className = 'log-row';
      row.innerHTML = '<div class="meta">'+meta+'</div>' + (fields? '<div>'+fields+'</div>':'');
      body.appendChild(row);
    }
  }

  async function refreshLogs(){ const evs = await fetchLogs(); render(evs); }
  refresh.addEventListener('click', refreshLogs);
  clearBtn.addEventListener('click', async ()=>{
    if (!confirm('Clear call log?')) return;
    await fetch('/api/admin/calls/clear', {method:'POST', credentials:'include'});
    await refreshLogs();
  });

  await refreshLogs();
})();
</script>
