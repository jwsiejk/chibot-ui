<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf" content="" />
  <title>Ask Chip</title>
  <link rel="stylesheet" href="/static/css/app.css" />

<script>
// --- AskChip: stable per-tab session id helper (localStorage) ---
(function(){
  function sid(){
    try{
      const k='chip.sid';
      let s = localStorage.getItem(k);
      if(!s){
        s = (crypto.randomUUID?.() ?? (Date.now() + '-' + Math.random()));
        localStorage.setItem(k, s);
      }
      return s;
    }catch(_){
      // fallback on window if localStorage unavailable
      return (window.askchipSessionId ||= (crypto.randomUUID?.() ?? (Date.now() + '-' + Math.random())));
    }
  }
  // expose both for legacy code paths
  window.getAskChipSID = sid;
  window.askchipSessionId = window.askchipSessionId || sid();
})();
</script>

</head>
<body class="zoom">
  <header class="topbar">
    <div class="brand">AskChip</div>
    <div class="menu-wrap">
      <button id="startButton" class="primary" disabled>Start</button>
      <button id="endButton" disabled>End</button>
      <span id="stateDot" class="dot dot-ready" title="Ready"></span>
      <button id="menuBtn" class="ghost">AskChip ▾</button>
    </div>
  </header>

  <main class="zoom-grid">
    <section class="video-pane">
      <div class="chip-face">
        <div class="status-row">
          <span class="status-label">Status:</span>
          <span id="statusText">Ready</span>
        </div>
        <div id="chatMessages" class="chat"></div>
      </div>
      <div class="composer">
        <input id="composer" placeholder="Type a message…" />
        <button id="composerSend">Send</button>
      </div>
    </section>
    <aside class="side-pane">
      <h4>Suggestions</h4>
      <ul id="sugg"></ul>
    </aside>
  </main>

  <!-- Login / Profile Modals -->
  <div id="loginModal" class="modal hidden">
    <div class="sheet">
      <h3>Sign in</h3>
      <p>Login with your Trace3 or Pure email.</p>
      <form id="inlineLoginForm">
        <input id="inlineLoginEmail" type="email" placeholder="you@trace3.com or you@purestorage.com" />
        <div class="actions">
          <button id="inlineLoginSubmit" type="submit" class="primary">Sign in</button>
          <button id="inlineLoginCancel" type="button">Cancel</button>
        </div>
        <div id="inlineLoginMsg" class="msgline"></div>
      </form>
    </div>
  </div>

  <div id="profileModal" class="modal hidden">
    <div class="sheet">
      <h3>Profile</h3>
      <div class="grid">
        <label>Name<input id="prof_name"/></label>
        <label>Email<input id="prof_email" disabled/></label>
        <label>Role<input id="prof_role"/></label>
        <label>Region<input id="prof_region"/></label>
        <label>Company<input id="prof_company"/></label>
      </div>
      <div class="actions">
        <button id="profileSave" class="primary">Save</button>
        <button id="profileCancel" type="button">Cancel</button>
      </div>
      <div id="profileMsg" class="msgline"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/static/js/csrf.js?v=v20250911b"></script>
  <script type="module" src="/static/js/audio.js?v=v20250911b"></script>
  <script type="module" src="/static/js/voice.js?v=v20250911b"></script>
  <script type="module" src="/static/js/ws.js?v=v20250911b"></script>
  <script type="module" src="/static/js/ui_menu.js?v=v20250911b"></script>
  <script type="module" src="/static/js/auth_gate.js?v=v20250911b"></script>
  <script type="module" src="/static/js/app.js?v=v20250911b"></script>

<script type="module">
/* AskChip bootstrap — ensures WS token, opens WS bound to sid(), greets deterministically */
import { ensureCSRF, installFetchInterceptor } from '/static/js/csrf.js';
try { installFetchInterceptor(); } catch(_) {}

let openWS, waitWSOpen;
try{
  const wsmod = await import('/static/js/ws.js');
  openWS = wsmod.openWS; waitWSOpen = wsmod.waitWSOpen;
}catch(_){
  // Minimal inline WS open fallback if ws.js isn't present
  window._dbg = window._dbg || {};
  openWS = async function(token){
    const sid = window.getAskChipSID();
    const wsurl = `${location.origin.replace(/^http/,'ws')}/ws/v1/chat?session_id=${encodeURIComponent(sid)}${token?`&ws_token=${encodeURIComponent(token)}`:''}`;
    const ws = new WebSocket(wsurl);
    window._dbg.ws = ws;
    return new Promise(res=>{ ws.onopen=()=>res(ws); });
  };
  waitWSOpen = ()=>Promise.resolve();
}

async function fetchWsToken(){
  const sid = window.getAskChipSID();
  try{
    const r = await fetch(`/api/v1/auth/ws-token?session_id=${encodeURIComponent(sid)}`, {credentials:'include'});
    const j = await r.json();
    if (j && j.ok && j.token) return j.token;
  }catch(_){}
  return null;
}

async function greet(){
  const sid = window.getAskChipSID();
  const r = await fetch(`/api/v1/greet?session_id=${encodeURIComponent(sid)}&reset=1`, {credentials:'include'});
  return r.ok;
}

async function startAskChip(){
  const token = await fetchWsToken();
  await openWS(token);
  await waitWSOpen();
  await greet();
}

function wireStart(){
  const btn = document.getElementById('startButton') || document.querySelector('[data-role="start-btn"]');
  if (!btn) return;
  btn.disabled = false;
  btn.addEventListener('click', async (e)=>{
    e.preventDefault();
    btn.disabled = true;
    try{ await startAskChip(); } finally { btn.disabled = false; }
  }, { once: false });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wireStart);
else wireStart();
</script>

</body>
</html>
