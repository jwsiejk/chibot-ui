<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask Chip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />

  <!-- Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='user-experience/css/style.css') }}?v=20250810-chat" />

  <!-- Scripts (viseme first, then main) -->
  <script defer src="{{ url_for('static', filename='chip/chip-viseme.js') }}?v=20250810-chat"></script>
  <script type="module" src="{{ url_for('static', filename='user-experience/js/main.js') }}?v=20250810-chat"></script>

</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <!-- Removed the white "Chip" brand label -->
    <div class="actions">
      <div class="dropdown nav">
        <button id="navMenuBtn" class="btn btn--accent">Ask Chip ▾</button>
        <ul id="navMenu" class="menu" hidden>
          <li><button id="navProfile">Profile</button></li>
        </ul>
      </div>
    </div>
  </header>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Welcome to Ask Chip</h2>
      <p id="loginHint" class="hint"></p>
      <form id="loginForm" class="stack">
        <input type="email" name="email" placeholder="Email address" required />
        <input type="password" name="password" placeholder="Password (disabled for preview)" disabled aria-disabled="true" />
        <small style="display:block;margin-top:6px;opacity:.7">
          Password is disabled for this preview. Use your Trace3 or Pure Storage email address.
        </small>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h2>Complete Your Profile</h2>
      <p id="profileHint" class="hint"></p>
      <form id="profileForm" class="stack">
        <input type="text" name="name" placeholder="Full name" required />
        <input type="text" name="title" placeholder="Title" />
        <input type="email" name="email" placeholder="Email (from login)" readonly />
      </form>
      <button id="saveProfileBtn" class="btn" style="margin-top:10px;">Save</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="app" style="display:none">
    <div class="chip-box" id="chipBox">
      <img id="chipImage" src="{{ url_for('static', filename='chip/img/chip.png') }}" alt="Chip" />
      <!-- Mouth overlay (chip-viseme.js will control src/position) -->
      <img id="chipMouthImg" alt="" />
    </div>

    <!-- Chat panel (simple, docked) -->
    <section id="chatPanel" aria-label="Chat with Chip" hidden>
      <div id="chatLog" class="chat-log" aria-live="polite"></div>
      <div class="chat-composer">
        <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off" />
        <button id="chatSendBtn" class="btn">Send</button>
      </div>
    </section>
  </div>

  <!-- Bottom toolbar -->
  <div id="askChipToolbar">
    <button id="btnModeStatic">Static</button>
    <!-- Renamed for clarity with the guide text -->
    <button id="btnModeDynamic">Start</button>

    <button id="btnMic"  title="Hold to talk">🎤 Mic</button>

    <!-- Chat with caret -->
    <div class="dropdown" id="chatDropdown">
      <button id="chatMenuBtn" title="Choose chat mode">💬 Chat ▾</button>
      <div class="dropdown-content" id="chatMenu">
        <div class="menuitem" data-lane="live">🔊 Chat Live (TTS)</div>
        <div class="menuitem" data-lane="text">💬 Chat Text</div>
      </div>
    </div>

    <div class="dropdown">
      <button title="More">⋯ More</button>
      <div class="dropdown-content">
        <div id="btnHistory">Conversation History</div>
        <div id="btnLogout">Log out</div>
      </div>
    </div>
  </div>

  <!-- User Guide panel (top-left) -->
  <div id="guidePanel" style="
    position:fixed; top:16px; left:16px; z-index:2000;
    background:rgba(0,0,0,0.6); color:#fff; padding:12px 14px;
    border-radius:12px; font-size:14px; line-height:1.35; max-width:320px;
    backdrop-filter: blur(4px); display:none;
  ">
    <!-- populated by main.js -->
  </div>

  <!-- Admin Debug panel (bottom-left) -->
  <div id="debugPanel" style="
    position:fixed; bottom:16px; left:16px; z-index:2000;
    background:rgba(0,0,0,0.7); color:#9EE37D; padding:12px 14px;
    border-radius:12px; font:12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    width:480px; max-height:40vh; overflow:auto; display:none; white-space:pre-wrap;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  ">
    <!-- populated by main.js -->
  </div>

</body>
</html>
