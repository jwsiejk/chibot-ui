<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Chip</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f4;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 { color: #ff6600; }
    input, button {
      padding: 10px;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
      box-sizing: border-box;
    }
    button {
      background-color: #ff6600;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background-color: #e65c00; }
    .response {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 5px;
    }
    .hidden { display: none; }
    audio { margin-top: 10px; width: 100%; }
  </style>
</head>
<body>
  <h1>Ask Chip</h1>

  <div id="loginForm">
    <input id="name" type="text" placeholder="Your name" />
    <input id="email" type="email" placeholder="Your email or ID" />
    <input id="role" type="text" placeholder="Your role (optional)" />
    <input id="region" type="text" placeholder="Your region (optional)" />
    <button onclick="saveUserInfo()">Login</button>
  </div>

  <div id="chatSection" class="hidden">
    <input id="question" type="text" placeholder="What would you like to ask Chip?" />
    <button onclick="askChip()">Submit</button>
    <div class="response" id="chipReply" style="display:none">
      <strong>Chip says:</strong>
      <p id="chipText"></p>
      <audio id="chipAudio" controls></audio>
    </div>
  </div>

  <script>
    // Store login info
    function saveUserInfo() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const role = document.getElementById('role').value.trim();
      const region = document.getElementById('region').value.trim();

      if (!name || !email) {
        alert("Please enter your name and email.");
        return;
      }

      localStorage.setItem("chip_user", JSON.stringify({ name, email, role, region }));
      document.getElementById("loginForm").classList.add("hidden");
      document.getElementById("chatSection").classList.remove("hidden");
    }

    // Auto-load user info
    window.onload = () => {
      const user = localStorage.getItem("chip_user");
      if (user) {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("chatSection").classList.remove("hidden");
      }
    };

    async function askChip() {
      const question = document.getElementById('question').value;
      if (!question) return alert('Please enter a question.');

      const user = JSON.parse(localStorage.getItem("chip_user") || "{}");

      const responseDiv = document.getElementById('chipReply');
      const textElement = document.getElementById('chipText');
      const audioElement = document.getElementById('chipAudio');

      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, user })
      });

      const data = await res.json();
      textElement.innerText = data.text;
      audioElement.src = data.audio_url;
      audioElement.play();
      responseDiv.style.display = 'block';
    }
  </script>
</body>
</html>
