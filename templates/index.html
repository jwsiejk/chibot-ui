<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Chip</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    /* Small helpers for applying the layout */
    .layout { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px; }
    .right-first .stage { order: 2; }
    .right-first .chat  { order: 1; }
    .left-first  .stage { order: 1; }
    .left-first  .chat  { order: 2; }
    .hidden { display: none !important; }
  </style>
</head>
<body data-app="ask-chip">
  <header class="topbar">
    <div class="brand">Ask Chip</div>
    <nav class="menu">
      <a href="/admin">Admin</a>
      <a href="/diagnostics">Diagnostics</a>
    </nav>
  </header>

  <main class="layout left-first" id="layoutRoot">
    <!-- Left: Chip stage -->
    <section class="stage" id="chipStage">
      <div class="state-dots" id="stateDots">
        <span class="dot" data-state="ready"    title="Ready"></span>
        <span class="dot" data-state="listening" title="Listening"></span>
        <span class="dot" data-state="thinking"  title="Thinking"></span>
        <span class="dot" data-state="responding" title="Responding"></span>
      </div>

      <div class="chip-frame">
        <img id="chipImage" src="{{ url_for('static', filename='chip/img/chip.png') }}" alt="Chip" />
        <img id="chipMouth" alt="Mouth" />
      </div>

      <div class="instruction-strip" id="instructionStrip">
        <strong>Voice commands:</strong>
        “Hey Chip…”, “Stop Chip”, “Chip, hold on” — <em>ESC</em> is immediate interrupt
      </div>

      <div class="toolbar">
        <button id="btnStart" class="btn primary">Start</button>
        <button id="btnEnd" class="btn" disabled>End</button>
        <button id="btnMute" class="btn" aria-pressed="false">Audio: On</button>
        <button id="btnChat" class="btn" aria-pressed="true">Chat</button>
      </div>

      <div class="status-line">
        <span id="statusText">Ready</span>
      </div>
    </section>

    <!-- Right: Chat -->
    <aside class="chat" id="chatPane">
      <div class="chat-header">
        <div>Conversation</div>
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div class="chat-body" id="chatBody" aria-live="polite"></div>
      <div class="chat-compose">
        <input id="chatInput" placeholder="Type a message…" autocomplete="off">
        <button id="chatSend" class="btn">Send</button>
      </div>
    </aside>
  </main>

  <div class="banner hidden" id="errorBanner" role="alert"></div>

  <script>
    window.ASKCHIP = {
      api: {
        greet: "/api/v1/greet",
        chat: "/api/v1/chat",
        stt: "/api/v1/voice/stt",
        tts: "/api/v1/voice/tts-with-visemes",
        logs: "/api/v1/admin/logs",
        layouts: "/api/v1/admin/layouts",
        ws:   (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/v1/chat"
      },
      assets: {
        chipImage: "{{ url_for('static', filename='chip/img/chip.png') }}",
        visemeBase: "{{ url_for('static', filename='visemes/chip-2d-pack') }}/"
      },
      config: { ws_ping_interval_ms: 25000 }
    };

    async function applyPublishedLayout(){
      const root = document.getElementById("layoutRoot");
      const strip = document.getElementById("instructionStrip");
      const dots  = document.getElementById("stateDots");
      try {
        const r = await fetch(window.ASKCHIP.api.layouts + "?variant=published&breakpoint=desktop", {credentials:"include"});
        if (!r.ok) return; // keep defaults
        const j = await r.json();
        const L = j.layout || {};
        const side = (L.stage_side || "left").toLowerCase();
        root.classList.remove("left-first","right-first");
        root.classList.add(side === "right" ? "right-first" : "left-first");
        // visibility
        strip.classList.toggle("hidden", !L.show_instruction_strip);
        dots.classList.toggle("hidden", !L.show_state_dots);
      } catch (e) {
        // ignore; defaults apply
      }
    }
    document.addEventListener("DOMContentLoaded", applyPublishedLayout);
  </script>

  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
