<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask Chip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />

  <link rel="stylesheet" href="{{ url_for('static', filename='user-experience/css/style.css') }}?v=20250809-fix" />
  <script src="{{ url_for('static', filename='user-experience/js/main.js') }}?v=20250809-fix" defer></script>
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">Chip</div>
    <div class="actions">
      <div class="dropdown nav">
        <button id="navMenuBtn" class="btn btn--accent">Ask Chip ▾</button>
        <ul id="navMenu" class="menu" hidden>
          <li><button id="navProfile">Profile</button></li>
        </ul>
      </div>
    </div>
  </header>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Welcome to Ask Chip</h2>
      <p id="loginHint" class="hint"></p>
      <form id="loginForm" class="stack">
        <input type="email" name="email" placeholder="Email address" required />
        <input type="password" name="password" placeholder="Password (disabled for preview)" disabled aria-disabled="true" />
        <small style="display:block;margin-top:6px;opacity:.7">
          Password is disabled for this preview. Use your Trace3 or Pure Storage email address.
        </small>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h2>Complete Your Profile</h2>
      <p id="profileHint" class="hint"></p>
      <form id="profileForm" class="stack">
        <input type="text" name="name" placeholder="Full name" required />
        <input type="text" name="title" placeholder="Title" />
        <input type="email" name="email" placeholder="Email (from login)" readonly />
      </form>
      <button id="saveProfileBtn" class="btn" style="margin-top:10px;">Save</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="app" style="display:none">
    <div class="chip-box" id="chipBox">
      <img id="chipImage" src="{{ url_for('static', filename='chip/img/chip.png') }}" alt="Chip" />
    </div>
  </div>

  <!-- Bottom toolbar -->
  <div id="askChipToolbar">
    <button id="btnModeStatic">Static</button>
    <button id="btnModeDynamic">Dynamic</button>

    <button id="btnMic"  title="Hold to talk">🎤 Mic</button>
    <button id="btnAsk"  title="Open chat">💬 Chat</button>

    <div class="dropdown">
      <button title="More">⋯ More</button>
      <div class="dropdown-content">
        <div id="btnHistory">Conversation History</div>
        <div id="btnLogout">Log out</div>
      </div>
    </div>
  </div>

</body>
</html>
