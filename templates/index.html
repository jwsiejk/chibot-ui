<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask Chip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />

  <!-- Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='user-experience/css/style.css') }}?v=20250812-ui" />

  <!-- Scripts (viseme first, then main) -->
  <script defer src="{{ url_for('static', filename='chip/chip-viseme.js') }}?v=20250810-chat"></script>
  <script type="module" src="{{ url_for('static', filename='user-experience/js/main.js') }}?v=20250810-chat"></script>
</head>

<body>

  <!-- Top bar (unchanged visual class names preserved) -->
  <header id="topbar" class="topbar">
    <div class="brand">Ask Chip</div>

    <!-- right-aligned menu -->
    <div id="askChipWrap" class="actions dropdown nav">
      <button id="chatMenuBtn" class="btn small">Chat</button>
      <ul id="chatMenu" class="menu" style="display:none">
        <li><button data-lane="text">💬 Chat (Text)</button></li>
        <li><button data-lane="live">🎙️ Chat Live (TTS)</button></li>
        <li class="divider" style="height:1px;background:rgba(255,255,255,.1);margin:.25rem 0"></li>
        <li><button data-lane="profile">👤 Edit Profile</button></li>
        <li><button data-lane="logout">🚪 Logout</button></li>
      </ul>
    </div>
  </header>

  <!-- App wrapper -->
  <div id="app">
    <div class="layout">
      <!-- LEFT COLUMN -->
      <div class="chat-col" id="chatColumn">
        <!-- Top: status banner -->
        <div id="statusBanner" class="status-banner">Disconnected. Press Start to begin a new session.</div>

        <!-- Middle: Chat windows (exclusive display) -->
        <section id="chatText" class="chat-window hidden" aria-label="Chat (Text)">
          <div id="chatLog" class="chat-log" aria-live="polite"></div>
          <div class="chat-composer stack">
            <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off" />
            <button id="chatSendBtn" class="btn btn--accent">Send</button>
          </div>
        </section>

        <section id="chatTTS" class="chat-window hidden" aria-label="Chat (TTS)">
          <div style="opacity:.7; font-size:14px; margin-bottom:8px;">Live voice chat (press Start → select “Chat Live (TTS)”)</div>
          <div id="ttsOnceControls" class="stack">
            <textarea id="ttsPrompt" rows="2" placeholder="Type something for Chip to say…"></textarea>
            <button id="ttsOnceBtn" class="btn">Speak once</button>
          </div>
          <audio id="ttsPlayer" controls style="margin-top:8px; width:100%"></audio>
        </section>

        <!-- Bottom: Administrator call log -->
        <div id="adminLog" class="admin-log" aria-label="Administrator Call Log"></div>
      </div>

      <!-- RIGHT COLUMN: existing Chip stage preserved -->
      <div class="chip-box-right" style="flex:1; min-width:320px;">
        <div id="chipBox" class="chip-box">
          <img id="chipImage" src="{{ url_for('static', filename='chip/chip.png') }}" alt="Chip" />
          <!-- Optional mouth overlay for visemes -->
          <img id="chipMouthImg" src="{{ url_for('static', filename='chip/mouth/neutral.png') }}" alt="" />
        </div>
      </div>
    </div>
  </div>

  <!-- Toolbar (unchanged) -->
  <footer id="askChipToolbar">
    <div class="toolbar-left">
      <button id="startBtn" class="btn btn--accent">Start</button>
      <button id="stopBtn" class="btn">Stop</button>
      <div class="dropdown">
        <button id="modeBtn" class="btn">Mode</button>
        <div class="dropdown-content">
          <div id="btnModeStatic">Static Greeting</div>
          <div id="btnModeDynamic">Dynamic Greeting</div>
        </div>
      </div>
    </div>
    <div class="toolbar-right">
      <span id="connState">Disconnected</span>
    </div>
  </footer>

  <!-- Inline module: exclusivity + admin logging (non-invasive) -->
  <script type="module">
  (() => {
    const $ = (id) => document.getElementById(id);

    function logAdmin(event, detail = "") {
      const wrap = $("adminLog");
      if (!wrap) return;
      const row = document.createElement("div");
      row.className = "admin-log-row";
      const ts = new Date().toLocaleTimeString();
      row.textContent = `[${ts}] ${event}${detail ? " — " + detail : ""}`;
      wrap.insertBefore(row, wrap.firstChild || null);
    }
    window.AskChipExtras = window.AskChipExtras || {};
    window.AskChipExtras.logAdmin = logAdmin;

    // Ensure hidden CSS safety
    if (!document.getElementById("hidden-style")) {
      const style = document.createElement("style");
      style.id = "hidden-style";
      style.textContent = `.hidden{display:none !important}`;
      document.head.appendChild(style);
    }

    const textPanel = $("chatText");
    const ttsPanel  = $("chatTTS");
    const menu      = $("chatMenu");
    const menuBtn   = $("chatMenuBtn");
    const textItem  = menu?.querySelector('[data-lane="text"]');
    const liveItem  = menu?.querySelector('[data-lane="live"]');

    function show(el){ el && el.classList.remove("hidden"); }
    function hide(el){ el && el.classList.add("hidden"); }
    function visible(el){ return el && !el.classList.contains("hidden"); }

    function openOnly(which){
      if (which === "text") {
        show(textPanel); hide(ttsPanel);
        logAdmin("ui", "opened text, closed tts");
        textPanel?.querySelector("input,textarea")?.focus?.();
      } else if (which === "tts") {
        show(ttsPanel); hide(textPanel);
        logAdmin("ui", "opened tts, closed text");
      }
    }

    function toggle(which){
      if (which === "text") {
        if (visible(textPanel)) { hide(textPanel); logAdmin("ui", "closed text"); }
        else openOnly("text");
      } else {
        if (visible(ttsPanel)) { hide(ttsPanel); logAdmin("ui", "closed tts"); }
        else openOnly("tts");
      }
    }

    // Wire menu toggles (keeps your existing handlers)
    textItem && textItem.addEventListener("click", () => toggle("text"));
    liveItem && liveItem.addEventListener("click", () => toggle("tts"));

    // Show/hide menu (preserving your CSS class usage)
    menuBtn && menuBtn.addEventListener("click", () => {
      if (!menu) return;
      const isOpen = menu.style.display !== "none";
      menu.style.display = isOpen ? "none" : "block";
    });

    // Log errors so “sideways” is visible
    window.addEventListener("error", (e) => logAdmin("error", e.message || "unknown"));
    window.addEventListener("unhandledrejection", (e) => logAdmin("promise", (e.reason && e.reason.message) || String(e.reason)));

    // Default banner text if empty
    const sb = $("statusBanner");
    if (sb && !sb.textContent.trim()) sb.textContent = "Disconnected. Press Start to begin a new session.";
  })();
  </script>

</body>
</html>
