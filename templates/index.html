<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask Chip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />

  <link rel="stylesheet" href="{{ url_for('static', filename='user-experience/css/style.css') }}?v=20250809-merge" />
  <script src="{{ url_for('static', filename='user-experience/js/main.js') }}?v=20250809h" defer></script>
</head>
<body>

  <!-- Subtle status cue -->
  <div id="chipStatusCue" aria-live="polite">Ready.</div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Welcome to Ask Chip</h2>
      <p id="loginHint" class="hint"></p>
      <form id="loginForm" class="stack">
        <input type="email" name="email" placeholder="Email address" required />
        <input type="password" name="password" placeholder="Password (disabled for preview)" disabled aria-disabled="true" />
        <small style="display:block;margin-top:6px;opacity:.7">
          Password is disabled for this preview. Use your Trace3 or Pure Storage email address.
        </small>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h2>Complete Your Profile</h2>
      <p id="profileHint" class="hint"></p>
      <form id="profileForm" class="stack">
        <input type="text" name="name" placeholder="Full name" required />
        <input type="text" name="title" placeholder="Title" />
        <input type="text" name="role" placeholder="Role" />
        <input type="text" name="region" placeholder="Region" />
      </form>
      <button id="saveProfileBtn" class="btn" style="margin-top:10px;">Save</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="app">
    <div class="chip-box" id="chipBox" style="display:none">
      <img id="chipImage" src="{{ url_for('static', filename='chip/img/chip.png') }}" alt="Chip" />
    </div>

    <div id="status"></div>
    <div id="chatArea"></div>
  </div>

  <!-- Auth boot (unchanged behavior) -->
  <script>
  (async function bootAuth() {
    const q = s => document.querySelector(s);
    const loginEl   = q('#loginModal');
    const profileEl = q('#profileModal');
    const appEl     = q('#app');
    const startBtn  = q('#startButton');
    const chipBox   = q('#chipBox');
    const toolbar   = q('#askChipToolbar');
    const cueEl     = q('#chipStatusCue');
    function show(el){ if(el){ el.removeAttribute('hidden'); el.style.display='block'; } }
    function hide(el){ if(el){ el.setAttribute('hidden',''); el.style.display='none'; } }
    function cue(text, cls=""){
      if (!cueEl) return;
      cueEl.className = ""; cueEl.textContent = text || "";
      if (cls) cueEl.classList.add(cls); void cueEl.offsetWidth;
      cueEl.classList.add("show");
      if (!["think","listen"].includes(cls)) {
        clearTimeout(cueEl._t); cueEl._t = setTimeout(()=>cueEl.classList.remove("show"), 1200);
      }
    }
    try {
      const r = await fetch('/api/me', { credentials: 'include' });
      if (!r.ok) { hide(appEl); hide(profileEl); show(loginEl); return; }
      const me = await r.json();
      if (!me.profileComplete) {
        hide(appEl); hide(loginEl); show(profileEl);
        if (startBtn) startBtn.disabled = true;
        return;
      }
      hide(loginEl); hide(profileEl); show(appEl);
      if (startBtn) startBtn.disabled = false;
      show(chipBox);
      show(toolbar);
      cue("Hi.");
      if (startBtn) startBtn.addEventListener("click", () => cue("Listening…","listen"));
      const btnAsk = q("#btnAsk"); if (btnAsk) btnAsk.addEventListener("click", ()=> cue("Thinking…","think"));
    } catch {
      hide(appEl); hide(profileEl); show(loginEl);
    }
  })();
  </script>

  <!-- Bottom title -->
  <div id="bottomTitle">Ask Chip</div>

  <!-- Toolbar -->
  <div id="askChipToolbar" style="display:none">
    <button id="startButton" class="btn" data-role="start">Start</button>
    <button id="btnMic"  title="Hold to talk">🎤 Mic</button>
    <button id="btnAsk"  title="Type a question">💬 Ask</button>
    <div class="dropdown">
      <button title="More">⋯ More</button>
      <div class="dropdown-content">
        <div id="btnHistory">Conversation History</div>
        <div id="btnProfile">Edit Profile</div>
        <div id="btnLogout">Log out</div>
      </div>
    </div>
  </div>

  <!-- Optional floating controls -->
  <button id="recordBtn" class="hidden">Hold to Record</button>
  <div id="recordPrompt" class="idle hidden">Hold the button to speak</div>
  <canvas id="waveform" class="hidden"></canvas>

</body>
</html>
