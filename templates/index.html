<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask Chip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="{{ url_for('static', filename='user-experience/css/style.css') }}?v=20250809-ui2" />
  <script src="{{ url_for('static', filename='user-experience/js/main.js') }}?v=20250809-ui2" defer></script>
</head>
<body>

  <!-- Subtle status cue -->
  <div id="chipStatusCue" aria-live="polite">Ready.</div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">Chip</div>
    <div class="actions">
      <div class="dropdown">
        <button id="askMenuBtn" class="btn ask-menu">Ask Chip ▾</button>
        <ul id="askMenu" class="menu" hidden>
          <li><button id="menuAsk">Ask Chip</button></li>
          <li><button id="menuProfile">Profile</button></li>
          <li><button id="menuHistory">History</button></li>
          <li><button id="menuLogout">Log out</button></li>
        </ul>
      </div>
    </div>
  </header>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Welcome to Ask Chip</h2>
      <p id="loginHint" class="hint"></p>
      <form id="loginForm" class="stack">
        <input type="email" name="email" placeholder="Email address" required />
        <input type="password" name="password" placeholder="Password (disabled for preview)" disabled aria-disabled="true" />
        <small style="display:block;margin-top:6px;opacity:.7">
          Password is disabled for this preview. Use your Trace3 or Pure Storage email address.
        </small>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h2>Complete Your Profile</h2>
      <p id="profileHint" class="hint"></p>
      <form id="profileForm" class="stack">
        <input type="text" name="name" placeholder="Full name" required />
        <input type="text" name="title" placeholder="Title" />
        <input type="email" name="email" placeholder="Email (from login)" readonly />
      </form>
      <button id="saveProfileBtn" class="btn" style="margin-top:10px;">Save</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="app" style="display:none">
    <!-- Chip stage (light frame that fills down the page) -->
    <section id="chipStage" class="chip-stage">
      <div class="chip-frame">
        <img id="chipImage" class="chip-img" src="{{ url_for('static', filename='chip/img/chip.png') }}" alt="Chip" />
      </div>
    </section>

    <div id="status"></div>
    <div id="chatArea"></div>
  </div>

  <!-- (Old bottom title/toolbar removed; replaced by top-right menu) -->

</body>
</html>
