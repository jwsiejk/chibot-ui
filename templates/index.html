<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask Chip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="{{ url_for('static', filename='user-experience/css/style.css') }}?v=20250812-ui" />
  <script defer src="{{ url_for('static', filename='chip/chip-viseme.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='user-experience/js/main.js') }}"></script>
</head>
<body>

<header id="topbar" class="topbar">
  <div class="brand">Ask Chip</div>
  <div id="askChipWrap" class="actions dropdown nav">
    <button id="navMenuBtn" class="btn small">Ask Chip ▾</button>
    <ul id="navMenu" class="menu" style="display:none">
      <li><button id="navProfile">👤 Edit Profile</button></li>
      <li><button id="navHistory">📜 Conversation History</button></li>
      <li><button id="navLogout">🚪 Logout</button></li>
    </ul>
  </div>
</header>

<div id="app">
  <div class="layout">
    <!-- Left Column -->
    <div class="chat-col" id="chatColumn">
      <div id="statusBanner" class="status-banner">Disconnected. Press Start to begin a new session.</div>

      <section id="chatText" class="chat-window hidden">
        <div id="chatLog" class="chat-log" aria-live="polite"></div>
        <div class="chat-composer stack">
          <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off" />
          <button id="chatSendBtn" class="btn btn--accent">Send</button>
        </div>
      </section>

      <section id="chatTTS" class="chat-window hidden">
        <div style="opacity:.7; font-size:14px; margin-bottom:8px;">Live voice chat (press Start → select “Chat Live (TTS)”)</div>
        <div id="ttsOnceControls" class="stack">
          <textarea id="ttsPrompt" rows="2" placeholder="Type something for Chip to say…"></textarea>
          <button id="ttsOnceBtn" class="btn">Speak once</button>
        </div>
        <audio id="ttsPlayer" controls style="margin-top:8px; width:100%"></audio>
      </section>

      <div id="adminLog" class="admin-log" aria-label="Administrator Call Log"></div>
    </div>

    <!-- Right Column -->
    <div class="chip-box-right" style="flex:1; min-width:320px;">
      <div id="chipBox" class="chip-box">
        <img id="chipImage" src="{{ url_for('static', filename='chip/chip.png') }}" alt="Chip" />
        <img id="chipMouthImg" src="{{ url_for('static', filename='chip/mouth/neutral.png') }}" alt="" />
      </div>
    </div>
  </div>
</div>

<footer id="askChipToolbar">
  <div class="toolbar-left">
    <button id="btnStart" class="btn btn--accent">Start</button>
    <button id="btnDisconnect" class="btn">Stop</button>
    <div class="dropdown">
      <button id="modeBtn" class="btn">Mode</button>
      <div class="dropdown-content">
        <div id="btnModeStatic">Static Greeting</div>
        <div id="btnModeDynamic">Dynamic Greeting</div>
      </div>
    </div>
  </div>
  <div class="toolbar-right">
    <span id="connState">Disconnected</span>
  </div>
</footer>

</body>
</html>
