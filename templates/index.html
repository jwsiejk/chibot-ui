<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Chip</title>

  <!-- Base styles -->
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/layout-addon.css" />

  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #0f1115; color: #e6e6e6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .hidden { display: none !important; }
    header#topbar { display:flex; align-items:center; gap:.5rem; padding:.5rem .75rem; border-bottom:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03); position:sticky; top:0; z-index:10; }
    #statusBanner { opacity:.8; margin-left:.5rem; }
    #layout { display:flex; gap:16px; padding:16px; }
    #chatPanel { flex: 0 0 520px; max-width: 520px; }
    #chipStage { flex: 1 1 auto; display:flex; align-items:center; justify-content:center; min-height: 60vh; position:relative; }
    #chipImage { max-width: 420px; width: 100%; height:auto; display:block; }
    #chipMouthImg { position:absolute; width:120px; height:auto; left:50%; transform:translateX(-50%); bottom:18%; pointer-events:none; }
    .panel { background: var(--panel, rgba(255,255,255,.03)); border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 10px; padding: 12px; }
    .inputRow { display:flex; gap:8px; margin-top:10px; }
    .inputRow input, .inputRow textarea { flex:1; }
    .menu { position:absolute; background: var(--panel, #141720); border:1px solid var(--border, rgba(255,255,255,.12)); border-radius:8px; padding:8px; box-shadow:0 8px 28px rgba(0,0,0,.45); }
    #navMenu { right:12px; top:46px; min-width:220px; }
    #chatMenu { right:160px; top:46px; min-width:160px; }
    #adminLogBtn { position: fixed; right: 16px; bottom: 16px; z-index: 30; }
  </style>

  <!-- If UI and API are on the same host, leave this empty string -->
  <script> window.__ASKCHIP_API_ORIGIN = ''; </script>
</head>
<body>

  <!-- Top bar -->
  <header id="topbar" role="banner">
    <button id="navMenuBtn" aria-haspopup="menu">Ask Chip ▾</button>
    <div id="statusBanner" aria-live="polite"></div>
    <div style="flex:1"></div>
    <button id="btnChat" title="Toggle Chat Panel">Ask Chip ▾</button>
    <div id="chatMenu" class="menu hidden" role="menu">
      <button id="btnChatText" data-lane="text" role="menuitem">Text Chat</button>
      <button id="btnChatLive" data-lane="live" role="menuitem">Live (voice)</button>
    </div>
    <button id="btnStart">Start</button>
    <button id="btnMic">🎤 Mic</button>
    <button id="btnDisconnect">Disconnect</button>

    <!-- App menu -->
    <div id="navMenu" class="menu hidden" role="menu">
      <button id="navProfile" role="menuitem">Profile…</button>
      <button id="navHistory" role="menuitem">History</button>
      <button id="navLogout" role="menuitem">Log out</button>
    </div>
  </header>

  <!-- Main layout: chat left, Chip stage right -->
  <main id="layout">
    <section id="chatPanel" class="panel" hidden>
      <!-- Text chat -->
      <div id="chatText" class="panel hidden" aria-label="Text chat">
        <div id="messages" style="min-height: 220px;"></div>
        <div class="inputRow">
          <input id="chatInput" type="text" inputmode="text" autocomplete="off" placeholder="Ask me anything about Pure Storage…" />
          <button id="chatSendBtn" type="button">Send</button>
        </div>
      </div>

      <!-- Live (TTS) chat -->
      <div id="chatTTS" class="panel hidden" aria-label="Live voice">
        <p>Press <strong>Mic</strong> to talk. I’ll listen for your question and respond.</p>
      </div>
    </section>

    <!-- Chip stage -->
    <aside id="chipStage" aria-label="Chip">
      <img id="chipImage" alt="Chip" src="/static/chip/img/chip.png" />
      <img id="chipMouthImg" alt="" src="/static/chip/img/visemes/mouth_neutral.png" />
      <audio id="chipAudio" hidden></audio>
    </aside>
  </main>

  <!-- Profile modal placeholder (wired by auth/profile.js) -->
  <div id="profileModal" class="hidden" role="dialog" aria-modal="true"></div>

  <!-- Admin log button & panel (optional, only shown for admins) -->
  <button id="adminLogBtn" class="hidden">Admin Log</button>
  <div id="adminLogPanel" class="hidden">
    <header>
      <strong>Call Log</strong>
      <span class="controls">
        <button id="adminRefresh">Refresh</button>
        <button id="adminClear">Clear</button>
        <button id="adminClose">Close</button>
      </span>
    </header>
    <div id="adminLogBody"></div>
  </div>

  <!-- Health ping (console) -->
  <script>
    (async () => {
      try {
        const h = await fetch("/api/health", { credentials: "include" }).then(r => r.json());
        console.log("[AskChip] health", h);
      } catch (e) {
        console.warn("[AskChip] health check failed", e);
      }
    })();
  </script>

  <!-- Load the ES-module UI last so the DOM exists -->
  <script type="module" src="/static/user-experience/js/main.js?v=2025-08-30-r7"></script>

  <!-- Legacy orchestrator shim intentionally removed -->
</body>
</html>
