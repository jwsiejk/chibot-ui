<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Chip</title>

  <!-- Core styles (no design-mode) -->
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/app_phase6.css" />
  <link rel="stylesheet" href="/static/css/ui_polish.css" />

<style>
  .ac-overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);z-index:1200}
  .ac-modal{background:#111419;color:#eaeef5;border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6);padding:1.2rem;min-width:360px;max-width:92vw}
  .ac-input{display:block;width:100%;padding:.65rem .75rem;background:#0f1216;color:#eaeef5;border:1px solid rgba(255,255,255,.18);border-radius:10px}
  .ac-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .ac-label{display:block;font-size:.85rem;opacity:.9;margin:.25rem 0}
  .ac-actions{display:flex;gap:.5rem;align-items:center;justify-content:flex-end;margin-top:1rem}
  .banner{margin:1rem auto;max-width:980px;background:#fff3cd;border:1px solid #ffe69c;color:#664d03;border-radius:12px;padding:.75rem 1rem;font-family:system-ui}
</style>

</head>
<body


<!-- Inline Profile Modal -->
<div id="profileModal" hidden style="position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);z-index:1200">
  <div style="background:#111419;color:#eaeef5;border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6);padding:1.2rem 1.2rem;min-width:480px;max-width:92vw">
    <div style="font-weight:800;font-size:1.05rem;margin-bottom:.5rem">Please fill out your profile to continue</div>
    <form id="inlineProfileForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div><label style="display:block;font-size:.85rem;opacity:.9;margin-bottom:.25rem">Email</label>
          <input id="prof_email" name="email" type="email" placeholder="you@company.com" readonly
                 style="display:block;width:100%;padding:.65rem .75rem;background:#0f1216;color:#aeb6c1;border:1px solid rgba(255,255,255,.18);border-radius:10px;opacity:.85"/></div>
        <div><label style="display:block;font-size:.85rem;opacity:.9;margin-bottom:.25rem">Name</label>
          <input id="prof_name" name="name" type="text" placeholder="Full name"
                 style="display:block;width:100%;padding:.65rem .75rem;background:#0f1216;color:#eaeef5;border:1px solid rgba(255,255,255,.18);border-radius:10px"/></div>
        <div><label style="display:block;font-size:.85rem;opacity:.9;margin-bottom:.25rem">Title</label>
          <input id="prof_role" name="role" type="text" placeholder="Title / Role"
                 style="display:block;width:100%;padding:.65rem .75rem;background:#0f1216;color:#eaeef5;border:1px solid rgba(255,255,255,.18);border-radius:10px"/></div>
        <div><label style="display:block;font-size:.85rem;opacity:.9;margin-bottom:.25rem">Region</label>
          <input id="prof_region" name="region" type="text" placeholder="eg. PA"
                 style="display:block;width:100%;padding:.65rem .75rem;background:#0f1216;color:#eaeef5;border:1px solid rgba(255,255,255,.18);border-radius:10px"/></div>
        <div><label style="display:block;font-size:.85rem;opacity:.9;margin-bottom:.25rem">Company (optional)</label>
          <input id="prof_company" name="company" type="text" placeholder="Company"
                 style="display:block;width:100%;padding:.65rem .75rem;background:#0f1216;color:#eaeef5;border:1px solid rgba(255,255,255,.18);border-radius:10px"/></div>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center;justify-content:flex-end;margin-top:1rem">
        <button type="button" id="inlineProfileCancel" class="btn">Cancel</button>
        <button type="submit" id="inlineProfileSubmit" class="btn btn-primary">Save</button>
      </div>
      <div id="inlineProfileMsg" style="margin-top:.6rem;font-size:.9rem;opacity:.9"></div>
    </form>
  </div>
</div>
<div style="display:flex;gap:.5rem;align-items:center;justify-content:flex-end;margin-top:1rem">
        <button type="button" id="inlineProfileCancel" class="btn">Cancel</button>
        <button type="submit" id="inlineProfileSubmit" class="btn btn-primary">Save</button>
      </div>
      <div id="inlineProfileMsg" style="margin-top:.5rem;font-size:.9rem;opacity:.9"></div>
    </form>
  </div>
</div>



<!-- Inline Login Modal -->
<div id="loginModal" hidden style="position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);z-index:1200">
  <div style="background:#111419;color:#eaeef5;border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6);padding:1.2rem 1.2rem;min-width:360px;max-width:92vw">
    <div style="font-weight:800;font-size:1.05rem;margin-bottom:.5rem">Please login with your Trace3 or Pure Storage email address</div>
    <form id="inlineLoginForm">
      <label style="display:block;font-size:.85rem;opacity:.9;margin-bottom:.25rem">Email</label>
      <input id="inlineLoginEmail" type="email" placeholder="you@trace3.com or you@purestorage.com" autocomplete="email"
             style="display:block;width:100%;padding:.65rem .75rem;background:#0f1216;color:#eaeef5;border:1px solid rgba(255,255,255,.18);border-radius:10px;margin-bottom:.9rem"/>
      <div style="display:flex;gap:.5rem;align-items:center;justify-content:flex-end">
        <button type="button" id="inlineLoginCancel" class="btn">Cancel</button>
        <button type="submit" id="inlineLoginSubmit" class="btn btn-primary">Login</button>
      </div>
      <div id="inlineLoginMsg" style="margin-top:.6rem;font-size:.9rem;opacity:.9"></div>
    </form>
  </div>
</div>
data-state="ready">

<header class="topbar">
  <div class="brand"></div>
  <nav class="menu">
    <button id="menuBtn" class="btn btn-ghost">AskChip</button>
  </nav>
</header>

<div id="profileGateBanner" hidden style="margin:1rem auto;max-width:980px;background:#fff3cd;border:1px solid #ffe69c;color:#664d03;border-radius:12px;padding:.75rem 1rem;font-family:system-ui">Please fill out your profile to continue.</div>
<main class="container">
  <section class="stage-card" id="chipStage">
    <div class="stage-head">
      <div class="state" id="stateDots">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div id="stateLabel" class="label">Ready</div>
    </div>

    <div class="stage-inner">
      <div id="chipPane" style="position:relative;">
        <img id="chipImage" src="/static/chip/img/chip.png" alt="Chip" width="640" height="640" />
        <div id="chipMouth" title="mouth_neutral"></div>
      </div>
    </div>

    <div class="instruction" id="instructionStrip">
      Voice commands: <strong>“Hey Chip…”</strong> • <strong>“Stop Chip”</strong> • <strong>“Chip, hold on”</strong>
      — <em>ESC</em> is immediate interrupt
    </div>

    <div class="controls" id="voiceControls">
      <button id="startButton" class="btn btn-primary">Start</button>
      <button id="endButton" class="btn" disabled>End</button>
      <button id="muteButton" class="btn">Audio: On</button>
      <button id="chatButton" class="btn">Chat</button>
    </div>
  </section>

  <aside class="chat-card" id="chatPane">
    <div class="chat-head">Conversation</div>
    <div class="chat-msgs" id="chatMessages"></div>
    <div class="chat-compose" id="composerBar">
      <input id="composerInput" placeholder="Type to ask Chip…" />
      <button id="composerSend" class="btn">Send</button>
    </div>
  </aside>
</main>

<div id="suggestions" style="padding:0 16px;"></div>

<!-- JS (cache-busted to pull latest) -->
<script src="/static/js/csrf_interceptor.js?v={{ asset_version }}" defer></script>
<script type="module" src="/static/js/config.js?v={{ asset_version }}" defer></script>
<script type="module" src="/static/js/state.js?v={{ asset_version }}" defer></script>
<script type="module" src="/static/js/ws.js?v=20250908002332" defer></script>
<script type="module" src="/static/js/voice.js?v={{ asset_version }}" defer></script>
<script type="module" src="/static/js/audio.js?v={{ asset_version }}" defer></script>
<script type="module" src="/static/js/suggestions.js?v={{ asset_version }}" defer></script>
<script type="module" src="/static/js/app.js?v=20250908002332" defer></script>
<script src="/static/js/ui_menu.js?v={{ asset_version }}" defer></script>
</body>
</html>
