<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Chip</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Layout add-on: chat left (compact), Chip stage right (flexible) -->
  <link rel="stylesheet" href="/static/css/layout-addon.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="avatar" id="chipAvatar" title="Chip"></div>
      <h1>Ask Chip</h1>
    </div>
    <div class="status" id="appStatus" aria-live="polite">Ready — press “Talk to Chip” to begin.</div>
    <div class="user-menu" id="userMenu" hidden>
      <span id="userEmail"></span>
      <button id="profileBtn" class="link">Profile</button>
      <button id="logoutBtn" class="link">Logout</button>
    </div>
  </header>

  <!-- LOGIN VIEW -->
  <section id="loginView" class="view">
    <div class="card">
      <h2>Welcome</h2>
      <p>Log in with your email to continue.</p>
      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@company.com" required />
        <button id="loginSubmit" type="submit">Log In</button>
      </form>
    </div>
  </section>

  <!-- PROFILE VIEW -->
  <section id="profileView" class="view" hidden>
    <div class="card">
      <h2>Profile</h2>
      <p>Please fill out your profile to continue.</p>
      <form id="profileForm">
        <div class="grid">
          <div>
            <label>Email</label>
            <input type="email" id="profileEmail" disabled />
          </div>
          <div>
            <label>Name</label>
            <input type="text" id="profileName" required />
          </div>
          <div>
            <label>Title</label>
            <input type="text" id="profileTitle" />
          </div>
          <div>
            <label>Region</label>
            <input type="text" id="profileRegion" />
          </div>
        </div>
        <button id="profileSave" type="submit">Save</button>
      </form>
    </div>
  </section>

  <!-- CHAT VIEW -->
  <section id="chatView" class="view" hidden>
    <div id="chipStage" class="stage">
      <img id="chipSprite" alt="Chip" />
      <canvas id="chipCanvas"></canvas>
    </div>

    <div class="toolbar">
      <button id="micBtn" class="primary talk-btn" aria-pressed="false" title="Start a voice conversation">
        <span>Talk to Chip</span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" focusable="false">
          <path d="M12 14a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v4a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 14 0h-2zM11 19.93V22h2v-2.07A8.001 8.001 0 0 0 20 11h-2a6 6 0 0 1-12 0H4a8.001 8.001 0 0 0 7 8.93z"/>
        </svg>
      </button>
      <button id="endBtn" class="secondary" title="End conversation">End Conversation</button>
      <span class="hint" id="guideHint">Press “Talk to Chip” to start. Chip will greet you, then listen.</span>
    </div>

    <div id="chatLog" class="chat-log" aria-live="polite"></div>

    <form id="composer" class="composer">
      <textarea id="composerInput" rows="1" placeholder="Ask Chip anything about Pure Storage..."></textarea>
      <button id="sendBtn" class="primary" type="submit" disabled>Send</button>
    </form>
  </section>

  <script src="/static/js/api.js" defer></script>
  <script src="/static/js/ui.js" defer></script>
  <script src="/static/js/viseme.js" defer></script>
  <script src="/static/js/main.js" defer></script>
  <script src="/static/js/addons-email-intents.js" defer></script>

  <script>
  // Set this to your backend service URL (no trailing slash)
  window.ASKCHIP_API = "https://ask-chip.onrender.com";
</script>

  <script>
/* Ask Chip hotfix: force a stable /api/chat contract */
window.API = window.API || {};
window.API.chat = async function(prompt) {
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }) // also accepted by the server: message | text
    });
    let json;
    try { json = await res.json(); } catch { return { ok: false, error: "bad_json" }; }
    if (json && typeof json.ok === "boolean") return json;
    return { ok: false, error: "bad_shape", status: res.status, body: json };
  } catch (e) {
    return { ok: false, error: "exception", detail: String(e) };
  }
};

// Optional: show config status in the console to help debugging
fetch("/api/health").then(r=>r.json()).then(s=>console.info("[AskChip] health", s)).catch(()=>{});
</script>


  <!-- Orchestrator shim: prefer /api/chat (memory + style), else fall back -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!window.API || typeof API.chat !== 'function') return;
    const legacyChat = API.chat.bind(API);
    API.chat = async function (text) {
      try {
        const r = await fetch('/api/orchestrator', { method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (r.status !== 404) {
          const j = await r.json();
          if (j && j.ok) return { ok: true, reply: j.reply, state: j.state };
          return { ok: false, error: (j && j.error) || 'orchestrator error' };
        }
      } catch (e) {}
      return legacyChat(text);
    };
  });
</script>
</body>
</html>
