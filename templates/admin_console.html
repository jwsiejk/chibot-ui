<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Ask Chip — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <style>
    .wrap{max-width:1080px;margin:36px auto;padding:0 16px}
    .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .tabs button{padding:8px 12px;border-radius:10px;border:1px solid #202533;background:#161a22;color:#e6e9ef;cursor:pointer}
    .tabs button.active{border-color:#7aa0ff;box-shadow:0 0 0 2px rgba(122,160,255,.15) inset}
    .panel{display:none;border:1px solid #202533;border-radius:12px;background:#161a22;padding:16px;margin-bottom:16px}
    .panel.active{display:block}
    .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
    label{display:flex;flex-direction:column;font-size:13px;color:#9aa4b2}
    label > input, label > select, label > textarea{margin-top:6px;padding:8px;border-radius:8px;border:1px solid #202533;background:#0f1115;color:#e6e9ef}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
    .btn{padding:8px 12px;border-radius:10px;border:1px solid #202533;background:#0f1115;color:#e6e9ef;cursor:pointer}
    .btn.primary{border-color:#7aa0ff}
    .muted{color:#9aa4b2}
    table{width:100%;border-collapse:collapse}
    th,td{font-size:13px;border-bottom:1px solid #202533;padding:8px}
    .back{display:inline-block;margin-bottom:8px;color:#7aa0ff;text-decoration:none}
    .back:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back</a>
  <h1>Ask Chip — Admin</h1>

  <div class="tabs" id="tabs">
    <button data-tab="ux" class="active">User Experience</button>
    <button data-tab="flow">Conversational Flow</button>
    <button data-tab="vendor">Vendor — Streaming ASR (Deepgram) / VAD</button>
    <button data-tab="ptm">PTM Personality (NLP / NLU / NLG)</button>
    <button data-tab="diag">Diagnostics</button>
  </div>

  <!-- UX -->
  <section class="panel active" id="tab-ux">
    <h3>User Experience</h3>
    <div class="grid">
      <label>Theme
        <select id="theme">
          <option>light</option><option>dark</option><option>system</option>
        </select>
      </label>
      <label>Show instruction strip <input type="checkbox" id="show_instruction_strip"/></label>
      <label>Show state dots <input type="checkbox" id="show_state_dots"/></label>

      <label>Suggestions enabled <input type="checkbox" id="suggestions_enabled"/></label>
      <label>Suggestions — max items <input type="number" id="suggestions_max_items" min="0" max="4"/></label>
      <label>Suggestions — max words <input type="number" id="suggestions_max_words" min="1" max="7"/></label>

      <label>Nudges enabled <input type="checkbox" id="nudges_enabled"/></label>
      <label>Nudge delay (ms) <input type="number" id="nudge_delay_ms" min="0"/></label>
      <label>Nudge backoff after ignored <input type="number" id="nudge_backoff_after_ignored" min="0" max="5"/></label>

      <label>WS ping interval (ms) <input type="number" id="ws_ping_interval_ms" min="5000"/></label>
      <label>WS idle timeout (ms) <input type="number" id="ws_idle_timeout_ms" min="5000"/></label>
    </div>
    <div class="actions">
      <button class="btn primary" id="save-ux">Save</button>
    </div>
  </section>

  <!-- Flow -->
  <section class="panel" id="tab-flow">
    <h3>Conversational Flow</h3>
    <div class="grid">
      <label>Teacher move — summarize_next_actions (0..1)
        <input id="tm_summarize_next_actions" type="number" step="0.05" min="0" max="1"/>
      </label>
      <label>Teacher move — check_understanding (0..1)
        <input id="tm_check_understanding" type="number" step="0.05" min="0" max="1"/>
      </label>
      <label>Teacher move — deep_dive (0..1)
        <input id="tm_deep_dive" type="number" step="0.05" min="0" max="1"/>
      </label>

      <label>Barge-in confirm (ms) <input id="confirm_ms" type="number" min="0"/></label>
      <label>Echo threshold boost <input id="echo_threshold_boost" type="number" min="1" step="0.1"/></label>
      <label>Min speech (ms) <input id="min_speech_ms" type="number" min="0"/></label>
    </div>
    <div class="actions"><button class="btn primary" id="save-flow">Save</button></div>
  </section>

  <!-- Vendor / VAD -->
  <section class="panel" id="tab-vendor">
    <h3>Vendor — Streaming ASR (Deepgram) & VAD</h3>
    <div class="grid">
      <label>Deepgram model <input id="deepgram_model" value="nova-3"/></label>
      <label>Language <input id="deepgram_language" value="en"/></label>
      <label>Smart format <input id="deepgram_smart_format" type="checkbox" checked/></label>
      <label>Listen URL <input id="deepgram_listen_url" value="wss://api.deepgram.com/v1/listen"/></label>
      <label>Encoding <input id="deepgram_encoding" value="opus"/></label>
      <label>Sample rate <input id="deepgram_sample_rate" type="number" value="48000"/></label>
      <label>Interim results <input id="deepgram_interim_results" type="checkbox" checked/></label>

      <label>VAD attack (ms) <input id="vad_attack_ms" type="number" value="12"/></label>
      <label>VAD release (ms) <input id="vad_release_ms" type="number" value="240"/></label>
      <label>VAD dbFS threshold <input id="vad_dbfs_threshold" type="number" value="-42"/></label>
    </div>
    <div class="muted" style="margin-top:6px">
      Secrets (Deepgram API key) remain in environment variables; not editable here.
    </div>
    <div class="actions"><button class="btn primary" id="save-vendor">Save</button></div>
  </section>

  <!-- PTM -->
  <section class="panel" id="tab-ptm">
    <h3>PTM Personality (NLP / NLU / NLG)</h3>
    <div class="grid">
      <label>OpenAI model <input id="openai_model" value="gpt-4o-mini"/></label>
      <label>Temperature <input id="gen_temperature" type="number" step="0.05" min="0" max="2" value="0.3"/></label>
      <label>Top-p <input id="gen_top_p" type="number" step="0.05" min="0" max="1" value="1.0"/></label>
      <label>Max sentences <input id="gen_max_sentences" type="number" min="1" value="4"/></label>
      <label>Target verbosity <select id="gen_target_verbosity">
        <option>short</option><option selected>medium</option><option>long</option></select>
      </label>

      <label>Persona intensity (Nebraska %) <input id="nebraska_persona_level" type="number" step="0.01" min="0" max="1" value="0.13"/></label>
      <label>Use persona quotes <input id="nebraska_quotes_enabled" type="checkbox" checked/></label>

      <label>NLU: intent classification <input id="nlu_intent" type="checkbox" checked/></label>
      <label>NLU: sentiment/tone detection <input id="nlu_sentiment" type="checkbox" checked/></label>
      <label>NLP: context memory blending <input id="nlp_memory_blend" type="checkbox" checked/></label>
      <label>NLG: summarizer preference <select id="nlg_summary_pref">
        <option>never</option><option selected>auto</option><option>always</option></select>
      </label>
    </div>
    <div class="actions"><button class="btn primary" id="save-ptm">Save</button></div>
  </section>

  <!-- Diagnostics -->
  <section class="panel" id="tab-diag">
    <h3>Diagnostics</h3>
    <div class="row">
      <button class="btn primary" id="run-diag">Run quick checks</button>
      <span id="diag-status" class="muted">idle</span>
    </div>
    <div style="margin-top:10px">
      <table>
        <thead><tr><th>Check</th><th>OK</th><th>Details</th></tr></thead>
        <tbody id="diag-body"></tbody>
      </table>
    </div>

    <h3 style="margin-top:18px">Full System Test</h3>
    <div class="row">
      <button class="btn primary" id="run-diag-full">Run full system test</button>
      <span id="diag-full-status" class="muted">idle</span>
    </div>
    <div style="margin-top:10px">
      <table>
        <thead><tr><th>Check</th><th>OK</th><th>Details</th></tr></thead>
        <tbody id="diag-full-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script type="module" src="/static/js/admin_console.js"></script>
<script>
  // Deep-link to a tab
  (function(){
    const p=new URLSearchParams(location.search);
    const want=p.get('tab');
    if(!want) return;
    const btn=[...document.querySelectorAll('#tabs button')].find(b=>b.dataset.tab===want);
    if(btn) btn.click();
  })();
</script>
</body>
</html>
