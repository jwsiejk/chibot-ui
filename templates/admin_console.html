<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Ask Chip — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <style>
    .wrap{max-width:1080px;margin:36px auto;padding:0 16px}
    .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .tabs button{padding:8px 12px;border-radius:10px;border:1px solid #202533;background:#161a22;color:#e6e9ef;cursor:pointer}
    .tabs button.active{border-color:#7aa0ff;box-shadow:0 0 0 2px rgba(122,160,255,.15) inset}
    .panel{display:none;border:1px solid #202533;border-radius:12px;background:#161a22;padding:16px;margin-bottom:16px}
    .panel.active{display:block}
    .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
    label{display:flex;flex-direction:column;font-size:13px;color:#9aa4b2}
    input,select{margin-top:6px;background:#0f141d;border:1px solid #202533;border-radius:10px;color:#e6e9ef;padding:8px 10px}
    .row{display:flex;gap:10px;align-items:center}
    .btn{appearance:none;border-radius:10px;border:1px solid #2b7fcf;background:#5ab0ff;color:#0b111a;font-weight:600;padding:8px 12px;cursor:pointer}
    .btn.primary:hover{background:#3a99ea}
    .muted{color:#9aa4b2;font-size:13px}
    table{width:100%;border-collapse:collapse;background:#101522;border:1px solid #202533;border-radius:12px;overflow:hidden}
    thead th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#9aa0b2;background:#0e1220}
    th,td{font-size:13px;border-bottom:1px solid #202533;padding:8px}
    .back{display:inline-block;margin-bottom:8px;color:#7aa0ff;text-decoration:none}
    .back:hover{text-decoration:underline}
  </style>
  <!-- Diagnostics-only stylesheet (scoped to #admin-diagnostics, safe to include) -->
  <link rel="stylesheet" href="/static/css/admin_console.css"/>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back</a>
  <h1>Ask Chip — Admin</h1>

  <div class="tabs" id="tabs">
    <button data-tab="ux" class="active">User Experience</button>
    <button data-tab="flow">Conversational Flow</button>
    <button data-tab="vendor">Vendor — Streaming ASR (Deepgram) / VAD</button>
    <button data-tab="ptm">PTM / Persona</button>
    <button data-tab="ops">Ops & WS</button>
    <button data-tab="diag">Diagnostics</button>
  </div>

  <!-- UX -->
  <section class="panel active" id="tab-ux">
    <h3>User Experience</h3>
    <div class="grid">
      <label>Theme
        <select id="theme">
          <option>light</option><option>dark</option><option>system</option>
        </select>
      </label>
      <label>Show instruction strip <input type="checkbox" id="show_instruction_strip"/></label>
      <label>Show state dots <input type="checkbox" id="show_state_dots"/></label>

      <label>Suggestions enabled <input type="checkbox" id="suggestions_enabled"/></label>
      <label>Suggestions — max items <input id="suggestions_max_items" type="number" min="0" value="4"/></label>
      <label>Suggestions — max words <input id="suggestions_max_words" type="number" min="1" value="7"/></label>

      <label>Nudge delay (ms) <input id="nudge_delay_ms" type="number" value="4200"/></label>
      <label>Nudge backoff after ignored <input id="nudge_backoff_after_ignored" type="number" value="2"/></label>

      <label>WS ping interval (ms) <input id="ws_ping_interval_ms" type="number" value="15000"/></label>
      <label>WS idle timeout (ms) <input id="ws_idle_timeout_ms" type="number" value="60000"/></label>
    </div>
    <div class="actions" style="margin-top:10px"><button class="btn primary" id="save-ux">Save</button></div>
  </section>

  <!-- Flow -->
  <section class="panel" id="tab-flow">
    <h3>Conversational Flow</h3>
    <div class="grid">
      <label>Teacher move — summarize_next_actions (0..1) <input id="tm_summarize" type="number" step="0.05" min="0" max="1" value="0.6"/></label>
      <label>Teacher move — check_understanding (0..1) <input id="tm_check" type="number" step="0.05" min="0" max="1" value="0.5"/></label>
      <label>Teacher move — visualize (0..1) <input id="tm_visualize" type="number" step="0.05" min="0" max="1" value="0.2"/></label>
    </div>
    <div class="actions"><button class="btn primary" id="save-flow">Save</button></div>
  </section>

  <!-- Vendor -->
  <section class="panel" id="tab-vendor">
    <h3>Vendor — Streaming ASR / VAD</h3>
    <div class="grid">
      <label>Deepgram model <input id="dg_model" value="nova-2-general"/></label>
      <label>Interim results <input id="dg_partials" type="checkbox" checked/></label>
      <label>VAD confirm (ms) <input id="vad_confirm_ms" type="number" value="420"/></label>
      <label>Echo threshold boost <input id="echo_threshold_boost" type="number" value="12"/></label>
    </div>
    <div class="actions"><button class="btn primary" id="save-vendor">Save</button></div>
  </section>

  <!-- PTM -->
  <section class="panel" id="tab-ptm">
    <h3>PTM Personality (NLP / NLU / NLG)</h3>
    <div class="grid">
      <label>OpenAI model <input id="openai_model" value="gpt-4o-mini"/></label>
      <label>Temperature <input id="gen_temperature" type="number" step="0.05" min="0" max="2" value="0.3"/></label>
      <label>Top-p <input id="gen_top_p" type="number" step="0.05" min="0" max="1" value="1.0"/></label>
      <label>Max sentences <input id="gen_max_sentences" type="number" min="1" value="4"/></label>
      <label>Target verbosity <select id="gen_target_verbosity">
        <option>short</option><option selected>medium</option><option>long</option></select>
      </label>

      <label>Persona intensity (Nebraska %) <input id="nebraska_persona" type="number" step="0.01" min="0" max="1" value="0.13"/></label>
      <label>Use persona quotes <input id="nebraska_quotes_enabled" type="checkbox" checked/></label>

      <label>NLU: intent classification <input id="nlu_intent" type="checkbox" checked/></label>
      <label>NLU: sentiment/tone detection <input id="nlu_sentiment" type="checkbox" checked/></label>
      <label>NLP: context memory blending <input id="nlp_memory_blend" type="checkbox" checked/></label>
      <label>NLG: summarizer preference <select id="nlg_summary_pref">
        <option>never</option><option selected>auto</option><option>always</option></select>
      </label>
    </div>
    <div class="actions"><button class="btn primary" id="save-ptm">Save</button></div>
  </section>

  <!-- Ops -->
  <section class="panel" id="tab-ops">
    <h3>Ops & WebSocket</h3>
    <div class="grid">
      <label>Ping interval (ms) <input id="ops_ping_interval" type="number" value="15000"/></label>
      <label>Idle timeout (ms) <input id="ops_idle_timeout" type="number" value="60000"/></label>
    </div>
    <div class="actions"><button class="btn primary" id="save-ops">Save</button></div>
  </section>

  <!-- Diagnostics -->
  <section class="panel" id="tab-diag">
    <h3>Diagnostics</h3>
    <div class="row">
      <button class="btn primary" id="run-diag">Run quick checks</button>
      <span id="diag-status" class="muted">idle</span>
    </div>
    <div style="margin-top:10px">
      <table>
        <thead><tr><th>Check</th><th>OK</th><th>Details</th></tr></thead>
        <tbody id="diag-body"></tbody>
      </table>
    </div>

    <!-- Streaming status (ASR) -->
    <h3 style="margin-top:18px">Streaming status (ASR)</h3>
    <div class="row">
      <button class="btn" id="stream-refresh" type="button">Refresh</button>
      <span class="muted">Source: /api/v1/admin/diagnostics/streaming_status</span>
    </div>
    <div class="grid" style="margin-top:10px">
      <label>partials <input id="stream-partials" readonly value="0"/></label>
      <label>finals <input id="stream-finals" readonly value="0"/></label>
      <label>provider_errors <input id="stream-errors" readonly value="0"/></label>
      <label>breaker_open <input id="stream-breaker" readonly value="false"/></label>
    </div>

    <h3 style="margin-top:18px">Full System Test</h3>
    <div class="row">
      <button class="btn primary" id="run-diag-full">Run full system test</button>
      <span id="diag-full-status" class="muted">idle</span>
    </div>
    <div style="margin-top:10px">
      <table>
        <thead><tr><th>Check</th><th>OK</th><th>Details</th></tr></thead>
        <tbody id="diag-full-body"></tbody>
      </table>
    </div>

    <!-- Diagnostics (script-driven) -->
    <div id="admin-diagnostics"></div>
  </section>
</div>

<!-- Diagnostics script (no-ops unless #admin-diagnostics exists) -->
<script type="module" src="/static/js/admin_console.js"></script>
<script>
  // Tabs wiring + deep-link support
  (function(){
    const tabs = document.getElementById('tabs');
    if(!tabs) return;
    const btns = Array.from(tabs.querySelectorAll('button[data-tab]'));
    const panels = Array.from(document.querySelectorAll('.panel'));
    function activate(name){
      btns.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      panels.forEach(p => p.classList.toggle('active', p.id === `tab-${name}`));
    }
    btns.forEach(b => b.addEventListener('click', () => activate(b.dataset.tab)));
    const want = new URLSearchParams(location.search).get('tab') || 'ux';
    activate(want);
  })();
</script>

<!-- Lightweight poller for Streaming status -->
<script>
  (function(){
    async function fetchJSON(url){
      const r = await fetch(url, { credentials: 'same-origin' });
      if (!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }
    async function loadStreamingStatus(){
      try{
        const j = await fetchJSON('/api/v1/admin/diagnostics/streaming_status');
        const set = (id, v) => { const el=document.getElementById(id); if(el){ if('value' in el) el.value=String(v); else el.textContent=String(v);} };
        set('stream-partials', j.partials ?? 0);
        set('stream-finals', j.finals ?? 0);
        set('stream-errors', j.provider_errors ?? 0);
        set('stream-breaker', j.breaker_open ? 'true' : 'false');
      }catch(e){ /* no-op */ }
    }
    const btn = document.getElementById('stream-refresh');
    if (btn) btn.addEventListener('click', loadStreamingStatus);
    // light polling only when Diagnostics tab is visible
    setInterval(() => {
      var panel = document.getElementById('tab-diag');
      if (panel && panel.classList.contains('active')) loadStreamingStatus();
    }, 1000);
    // first paint
    loadStreamingStatus();
  })();
</script>
</body>
</html>
