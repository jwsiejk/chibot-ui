<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Chip — Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    .tabs { display:flex; gap:.5rem; margin:1rem 0; flex-wrap: wrap; }
    .tab { padding:.5rem .75rem; border:1px solid #ccd; border-radius:10px; cursor:pointer; background:#f7f9fc; }
    .tab[aria-selected="true"] { background:#e8eefc; border-color:#7aa0ff; }
    .panel { display:none; }
    .panel[aria-hidden="false"] { display:block; }
    .form-grid { display:grid; grid-template-columns: 240px 1fr; gap:.5rem 1rem; align-items:center; }
    .hint { color:#9aa4b2; }
  </style>
</head>
<body data-app="ask-chip-admin">
  <header class="topbar">
    <div class="brand">Ask Chip — Admin</div>
    <nav class="menu"><a href="/">Back to App</a></nav>
  </header>

  <main class="container">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-controls="tab-logs"    aria-selected="true"  id="t-logs">Live Logs</button>
      <button class="tab" role="tab" aria-controls="tab-config"  aria-selected="false" id="t-config">Config</button>
      <button class="tab" role="tab" aria-controls="tab-layout"  aria-selected="false" id="t-layout">Layout</button>
      <button class="tab" role="tab" aria-controls="tab-users"   aria-selected="false" id="t-users">Users &amp; Memory</button>
    </div>

    <section id="tab-logs" class="panel" aria-hidden="false">
      <h2>Live Admin Log</h2>
      <div class="controls">
        <input id="logFilter" placeholder="filter text">
        <button class="btn" id="logClear">Clear</button>
      </div>
      <pre class="log" id="adminLog">(connecting...)</pre>
    </section>

    <section id="tab-config" class="panel" aria-hidden="true">
      <h2>Runtime Config</h2>
      <div id="configForm" class="form-grid"></div>
      <div style="margin-top:8px">
        <button id="cfgLoad" class="btn">Load</button>
        <button id="cfgSave" class="btn primary">Save</button>
        <span id="cfgStatus" class="hint"></span>
      </div>
    </section>

    <section id="tab-layout" class="panel" aria-hidden="true">
      <h2>Layout Editor (Design Mode)</h2>
      <p class="hint">Set where the Chip pane lives and what UI elements are visible. Save as <em>Draft</em>, then <em>Publish</em> to apply for everyone.</p>
      <div class="form-grid">
        <label for="stageSide">Stage side</label>
        <select id="stageSide">
          <option value="left">Left (default)</option>
          <option value="right">Right</option>
        </select>

        <label for="showStrip">Show Instruction Strip</label>
        <input id="showStrip" type="checkbox" checked>

        <label for="showDots">Show State Dots</label>
        <input id="showDots" type="checkbox" checked>
      </div>

      <div style="margin-top:10px">
        <button id="lyLoadPublished" class="btn">Load Published</button>
        <button id="lyLoadDraft" class="btn">Load Draft</button>
        <button id="lySaveDraft" class="btn">Save Draft</button>
        <button id="lyPublish" class="btn primary">Publish</button>
        <span id="lyStatus" class="hint"></span>
      </div>
    </section>

    <section id="tab-users" class="panel" aria-hidden="true">
      <h2>Users &amp; Memory</h2>
      <p class="hint">Stub view for now.</p>
      <pre class="log" style="height:18rem">Coming soon.</pre>
    </section>
  </main>

  <script>
    window.ASKCHIP = {
      api: {
        logs: "/api/v1/admin/logs",
        config_get: "/api/v1/admin/config",
        config_set: "/api/v1/admin/config",
        layout_get: "/api/v1/admin/layouts",
        layout_set: "/api/v1/admin/layouts"
      }
    };
  </script>
  <script defer src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
