<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask Chip (3D)</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script>
    console.log("🧪 Loaded index_3d.html vDEBUG-6");
  </script>
  <style>
    body {
      margin: 0;
      background-color: #1e1e1e;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #recordBtn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 12px 24px;
      font-size: 16px;
      background-color: orange;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 165, 0, 0.4);
    }
    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 16px;
      color: #90ee90;
      max-width: 400px;
      font-weight: 500;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
    }
    #version-tag {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <button id="recordBtn">🎤 Ask Chip</button>
  <div id="status">Ready</div>
  <div id="version-tag">Ask Chip UI vDEBUG-6</div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.155.0';
    import { GLTFLoader } from 'https://esm.sh/three@0.155.0/examples/jsm/loaders/GLTFLoader';
    import { OrbitControls } from 'https://esm.sh/three@0.155.0/examples/jsm/controls/OrbitControls';

    let scene, camera, renderer;
    let model, visemeMap, skinnedMesh;
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const statusDiv = document.getElementById("status");

    function updateStatus(message) {
      statusDiv.textContent = message;
      console.log("[Chip]", message);
    }

    function renderOnce() {
      renderer.render(scene, camera);
    }

    function playVisemeAudio(audioUrl, visemes) {
      updateStatus("🔊 Playing Chip's response...");
      const audio = new Audio(audioUrl);
      audio.play();

      visemes.forEach(({ time, viseme }) => {
        const delay = time * 1000;
        const targetName = `viseme_${viseme}`;
        const index = visemeMap[targetName];
        if (index === undefined) return;

        setTimeout(() => {
          skinnedMesh.morphTargetInfluences.fill(0);
          skinnedMesh.morphTargetInfluences[index] = 1;
          renderOnce();
        }, delay);

        setTimeout(() => {
          skinnedMesh.morphTargetInfluences[index] = 0;
          renderOnce();
        }, delay + 120);
      });

      audio.onended = () => updateStatus("✅ Done. Ask another question.");
    }

    async function greetUser() {
      updateStatus("👋 Chip is saying hi...");
      const greeting = { text: "Hey there! I'm Chip. What can I help you with today?" };
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(greeting)
      });

      const data = await response.json();
      if (data.audio && skinnedMesh) {
        // fallback: no visemes from /ask
        playVisemeAudio(data.audio, []);
      }
    }

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 2.5);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x1e1e1e);

    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const loader = new GLTFLoader();
    loader.load('/static/models/chip.glb', async gltf => {
      model = gltf.scene;
      model.scale.set(1, 1, 1);
      scene.add(model);

      skinnedMesh = model.getObjectByProperty('type', 'SkinnedMesh');
      if (!skinnedMesh || !skinnedMesh.morphTargetDictionary) {
        updateStatus("⚠️ No viseme morph targets found.");
        return;
      }

      visemeMap = skinnedMesh.morphTargetDictionary;
      updateStatus("✅ Chip model loaded. Initializing...");
      renderOnce();
      await greetUser();
    });

    const controls = new OrbitControls(camera, renderer.domElement);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderOnce();
    });
  </script>
</body>
</html>
