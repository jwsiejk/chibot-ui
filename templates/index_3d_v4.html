<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Ask Chip (3D)</title>
  <script>
    console.log("🧪 Loaded index_3d_v5.html");

    async function greetUser() {
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: "Say hello to the user.", greeting: true })
        });
        const data = await response.json();
        if (data.audio) {
          playVisemeAudio(data.audio, [], "👋 Hi! I'm Chip. Ask me anything.");
        }
      } catch (err) {
        console.error("Greeting failed:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      greetUser();
    });
  </script>
</head>
<body>
  <button id="recordBtn">🎤 Ask Chip</button>
  <div id="status">Ready</div>

  <script>
    const recordBtn = document.getElementById("recordBtn");
    const statusDiv = document.getElementById("status");

    function updateStatus(message) {
      statusDiv.textContent = message;
      console.log("[Chip]", message);
    }

    recordBtn.addEventListener("click", async () => {
      if (recordBtn.disabled) return;
      recordBtn.disabled = true;
      updateStatus("🎙️ Listening...");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          updateStatus("📤 Uploading audio to Chip...");
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const formData = new FormData();
          formData.append("audio", blob, "input.webm");

          const response = await fetch("/ask-chip", { method: "POST", body: formData });
          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          let audioUrl = "";
          let collectingAudio = false;
          const audioChunks = [];

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            if (value && value.length > 2) {
              if (value[0] === 73 && value[1] === 68 && value[2] === 51) {
                collectingAudio = true;
              }
              if (collectingAudio) {
                audioChunks.push(value);
                continue;
              }
            }

            const text = decoder.decode(value);
            const lines = text.split("--frame").filter(Boolean);
            for (const line of lines) {
              const [, headers, content] = line.split(/\r?\n\r?\n/);
              if (!headers || !content) continue;

              const contentType = headers.match(/Content-Type: (.+)/)?.[1];
              if (contentType === "application/json") {
                const data = JSON.parse(content);
                if (data.transcript) updateStatus("🗣️ You said: " + data.transcript);
                if (data.response) console.log("🤖 Chip replied:", data.response);
              }
            }
          }

          if (audioChunks.length) {
            const fullAudioBlob = new Blob(audioChunks, { type: 'audio/mpeg' });
            audioUrl = URL.createObjectURL(fullAudioBlob);
          }

          if (audioUrl) {
            playVisemeAudio(audioUrl, []);
          } else {
            updateStatus("⚠️ No audio returned.");
          }
        };

        recorder.start();
        setTimeout(() => recorder.stop(), 5000);
      } catch (err) {
        updateStatus("❌ Mic error.");
        console.error(err);
      }
    });

    window.playVisemeAudio = function(audioUrl, visemes, customDoneMessage = "✅ Done. Ask another question.") {
      updateStatus("🔊 Playing Chip's response...");
      const audio = new Audio(audioUrl);
      audio.play();
      audio.onended = () => {
        updateStatus(customDoneMessage);
        recordBtn.style.display = "block";
        recordBtn.disabled = false;
      };
    };
  </script>
</body>
</html>
