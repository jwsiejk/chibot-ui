
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Ask Chip (3D)</title>
<meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
<style>
    body {
      margin: 0;
      background-color: #1e1e1e;
      font-family: 'Segoe UI', sans-serif;
      color: orange;
      overflow: hidden;
    }
    #chipZoomFrame {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      border: 4px solid #444;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      padding: 8px;
      z-index: 5;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #chipZoomFrame img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
    }
    #askChipToolbar {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      padding: 10px 16px;
      border-radius: 14px 14px 0 0;
      display: flex;
      gap: 16px;
      z-index: 30;
      font-size: 14px;
    }
    #askChipToolbar button {
      background: none;
      border: none;
      color: orange;
      font-weight: bold;
      cursor: pointer;
    }
    .dropdown {
      position: relative;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      bottom: 30px;
      background: rgba(30,30,30,0.9);
      border-radius: 6px;
      padding: 6px;
      min-width: 140px;
      box-shadow: 0 0 6px #000;
    }
    .dropdown-content div {
      padding: 6px 8px;
      cursor: pointer;
    }
    .dropdown-content div:hover {
      background-color: rgba(255,165,0,0.2);
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>
<div id="chipZoomFrame">
<img alt="Chip Tracewell in Zoom-style view" src="/static/img/chip.png"/>
</div>
<div id="askChipToolbar">
<button id="startBtn">🎙️ Start</button>
<div class="dropdown">
<button id="audioBtn">🔈 Audio ▾</button>
<div class="dropdown-content" id="audioOptions">
<div>(Same as system)</div>
<div>USB Headset</div>
<div>Bluetooth</div>
</div>
</div>
<button id="resetBtn">🔁 Reset</button>
<button id="exitBtn">❌ End</button>
</div>
</body>
</html>
