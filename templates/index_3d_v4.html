<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask Chip (3D)</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script>
    console.log("🧪 Loaded index_3d.html vDEBUG-9");
  </script>
  <style>
    body {
      margin: 0;
      background-color: #1e1e1e;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #recordBtn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 12px 24px;
      font-size: 16px;
      background-color: orange;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 165, 0, 0.4);
    }
    .blinking {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { background-color: orange; }
      50% { background-color: #ffaa00; }
    }
    #caption {
      position: absolute;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      font-size: 12px;
      color: #cccccc;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 10px;
      border-radius: 6px;
      font-style: italic;
      pointer-events: none;
      max-width: 300px;
      z-index: 15;
    }
    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 16px;
      color: #90ee90;
      max-width: 400px;
      font-weight: 500;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
    }
    #version-tag {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <button id="recordBtn">🎤 Ask Chip</button>
  <div id="status">Ready</div>
  <div id="version-tag">Ask Chip UI vDEBUG-9</div>
  <div id="caption"></div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.155.0';
    import { GLTFLoader } from 'https://esm.sh/three@0.155.0/examples/jsm/loaders/GLTFLoader';
    import { OrbitControls } from 'https://esm.sh/three@0.155.0/examples/jsm/controls/OrbitControls';

    let scene, camera, renderer;
    let model, visemeMap, skinnedMesh;
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const statusDiv = document.getElementById("status");
    const recordBtn = document.getElementById("recordBtn");

    function updateStatus(message) {
      statusDiv.textContent = message;
      console.log("[Chip]", message);
    }

    function renderOnce() {
      renderer.render(scene, camera);
    }

    function playVisemeAudio(audioUrl, visemes, customDoneMessage = "✅ Done. Ask another question.") {
      updateStatus("🔊 Playing Chip's response...");
      recordBtn.classList.remove("blinking");
      const audio = new Audio(audioUrl);
      audio.play();

      visemes.forEach(({ time, viseme }) => {
        const delay = time * 1000;
        const targetName = `viseme_${viseme}`;
        const index = visemeMap[targetName];
        if (index === undefined) return;

        setTimeout(() => {
          skinnedMesh.morphTargetInfluences.fill(0);
          skinnedMesh.morphTargetInfluences[index] = 1;
          renderOnce();
        }, delay);

        setTimeout(() => {
          skinnedMesh.morphTargetInfluences[index] = 0;
          renderOnce();
        }, delay + 120);
      });

      audio.onended = () => {
        updateStatus(customDoneMessage);
        recordBtn.classList.add("blinking");
      };
    }

    async function greetUser() {
      updateStatus("👋 Chip is saying hi...");

      const name = sessionStorage.getItem("chip_name") || "there";
      const greeting = {
        question: `Hey ${name}! I'm Chip. What can I help you with today?`,
        name: name,
        greeting: true
      };

      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(greeting)
      });

      const data = await response.json();
      if (data.audio && skinnedMesh) {
        playVisemeAudio(data.audio, [], "👍 I'm ready when you are.");
        recordBtn.classList.add("blinking");
      }
    }

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 2.5);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x1e1e1e);

    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const loader = new GLTFLoader();
    loader.load('/static/models/chip.glb', async gltf => {
      model = gltf.scene;
      model.scale.set(1, 1, 1);
      scene.add(model);

      skinnedMesh = model.getObjectByProperty('type', 'SkinnedMesh');
      if (!skinnedMesh || !skinnedMesh.morphTargetDictionary) {
        updateStatus("⚠️ No viseme morph targets found.");
        return;
      }

      visemeMap = skinnedMesh.morphTargetDictionary;
      updateStatus("✅ Chip model loaded. Initializing...");
      renderOnce();
      await greetUser();
    });

    const controls = new OrbitControls(camera, renderer.domElement);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderOnce();
    });

    recordBtn.addEventListener("click", async () => {
      updateStatus("🎙️ Listening for 5 seconds...");
      recordBtn.classList.remove("blinking");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);

        recorder.onstop = async () => {
          updateStatus("📤 Uploading audio to Chip...");
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const formData = new FormData();
          formData.append("audio", blob, "input.webm");

          updateStatus("🧠 Processing request...");
          const response = await fetch("/ask-chip", { method: "POST", body: formData });
          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          let visemes = [];
          let audioUrl = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const text = decoder.decode(value);
            const lines = text.split("--frame").filter(Boolean);

            for (const line of lines) {
              const [, headers, content] = line.split(/\r?\n\r?\n/);
              if (!headers || !content) continue;

              const contentType = headers.match(/Content-Type: (.+)/)?.[1];
              if (contentType === "application/json") {
                const data = JSON.parse(content);
                if (data.viseme_timestamps) visemes = data.viseme_timestamps;
                if (data.audio) audioUrl = data.audio;
                if (data.transcript) {
                  updateStatus("🗣️ You said: " + data.transcript);
                  document.getElementById("caption").textContent = data.transcript;
                }
                if (data.response) console.log("🤖 Chip replied:", data.response);
              }
            }
          }

          if (audioUrl && visemes.length && skinnedMesh) {
            playVisemeAudio(audioUrl, visemes);
          } else {
            updateStatus("⚠️ Failed to get audio or visemes.");
          }
        };

        recorder.start();
        setTimeout(() => recorder.stop(), 5000);
      } catch (err) {
        updateStatus("❌ Microphone access failed.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
