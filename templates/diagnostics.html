<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body>

    <table id="results"><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Details</th></tr></thead><tbody></tbody></table>

  <template id="row-tpl"><tr><td class="i"></td><td class="n"></td><td class="s"></td><td class="d"></td></tr></template>
  
  <script defer src="/static/js/diagnostics.js?v=v20250906a"></script>
