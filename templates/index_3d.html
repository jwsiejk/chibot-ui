<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask Chip (3D)</title>
  <style>
    body {
      background-color: #f3f3f3;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      color: #111;
    }

    a {
      text-decoration: none;
      color: #f26722;
      font-size: 14px;
      margin: 0 10px;
    }

    #container {
      width: 700px;
      margin: 20px auto;
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    model-viewer {
      width: 100%;
      height: 500px;
      background-color: #1e1e1e;
    }

    form {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    input[type="text"] {
      width: 75%;
      padding: 12px;
      border: none;
      border-radius: 6px 0 0 6px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 12px 24px;
      background-color: #f26722;
      color: white;
      border: none;
      border-radius: 0 6px 6px 0;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #d15512;
    }

    #response {
      color: white;
      margin-top: 20px;
      font-size: 16px;
      min-height: 40px;
    }

    #transcript {
      color: #ccc;
      margin-top: 10px;
      font-size: 14px;
      font-style: italic;
    }

    audio {
      margin-top: 10px;
    }

    #mic-button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #ff6600;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #mic-button:hover {
      background-color: #e05600;
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <h1>Ask Chip (3D)</h1>
  <p>
    <a href="/profile">View Your Profile</a> |
    <a href="/logout">Logout</a>
  </p>

  <div id="container">
    <model-viewer
      id="chip-model"
      src="/static/models/chip.glb"
      alt="Chip the Virtual Engineer"
      autoplay
      auto-rotate
      camera-controls
      background-color="#1e1e1e">
    </model-viewer>

    <form id="chat-form">
      <input type="text" id="question" name="question" placeholder="Ask Chip a question..." required />
      <button type="submit">Submit</button>
    </form>

    <button id="mic-button">🎤 Ask Chip by Voice</button>

    <div id="response">Ask me anything about Pure Storage.</div>
    <div id="transcript"></div>
    <audio id="audio" controls style="display:none;"></audio>
  </div>

  <script>
    document.getElementById("chat-form").addEventListener("submit", async function(event) {
      event.preventDefault();

      const formData = new URLSearchParams();
      formData.append("question", document.getElementById("question").value);

      const responseDiv = document.getElementById("response");
      const audioPlayer = document.getElementById("audio");
      const transcriptDiv = document.getElementById("transcript");

      responseDiv.textContent = "Thinking...";
      transcriptDiv.textContent = "";
      audioPlayer.style.display = "none";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.error) {
          responseDiv.textContent = data.error;
        } else {
          responseDiv.textContent = data.response;
          transcriptDiv.textContent = "";
          audioPlayer.src = data.audio;
          audioPlayer.style.display = "block";
          audioPlayer.play();
        }
      } catch (err) {
        responseDiv.textContent = "Something went wrong. Try again later.";
        console.error(err);
      }
    });

    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const formData = new FormData();
          formData.append("audio", audioBlob, "user_input.webm");

          const responseDiv = document.getElementById("response");
          const transcriptDiv = document.getElementById("transcript");
          const audioPlayer = document.getElementById("audio");

          responseDiv.textContent = "Chip is responding...";
          transcriptDiv.textContent = "";
          audioPlayer.style.display = "none";

          try {
            const response = await fetch("/ask-chip", {
              method: "POST",
              body: formData
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let audioBuffer = [];

            let transcript = "";
            let gptReply = "";

            // Read the stream chunk-by-chunk
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              const textChunk = decoder.decode(value, { stream: true });

              try {
                const jsonChunk = JSON.parse(textChunk);

                if (jsonChunk.transcript) transcript = jsonChunk.transcript;
                if (jsonChunk.response) gptReply = jsonChunk.response;
                if (jsonChunk.audio) {
                  const audioStream = await fetch(jsonChunk.audio);
                  const blob = await audioStream.blob();
                  const audioUrl = URL.createObjectURL(blob);
                  audioPlayer.src = audioUrl;
                  audioPlayer.style.display = "block";
                  audioPlayer.play();
                }

              } catch (err) {
                console.warn("Non-JSON chunk or partial stream:", textChunk);
              }
            }

            responseDiv.textContent = gptReply || "Chip responded.";
            transcriptDiv.textContent = transcript ? `You said: "${transcript}"` : "";

          } catch (error) {
            responseDiv.textContent = "Voice processing failed.";
            console.error(error);
          }
        };

        mediaRecorder.start();
        document.getElementById("response").textContent = "🎙️ Listening...";
        setTimeout(() => mediaRecorder.stop(), 5000); // 5 seconds
      } catch (error) {
        document.getElementById("response").textContent = "Mic access failed.";
        console.error(error);
      }
    }

    document.getElementById("mic-button").addEventListener("click", () => {
      startRecording();
    });
  </script>
</body>
</html>
