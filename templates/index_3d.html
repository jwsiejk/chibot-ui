<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ask Chip (3D Demo)</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .container {
      background-color: #1c1c1c;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      width: 700px;
      max-width: 100%;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      background-color: #1c1c1c;
    }

    form {
      display: flex;
      margin-top: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 6px 0 0 6px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      background-color: #f60;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
    }

    #response {
      margin-top: 15px;
      color: white;
      font-family: monospace;
      background: #333;
      padding: 10px;
      border-radius: 6px;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <h1>Ask Chip (3D Demo)</h1>
  <div class="container">
    <model-viewer
      src="/static/models/chip.glb"
      alt="3D model of Chip"
      auto-rotate
      camera-controls
      disable-zoom
      ar
    ></model-viewer>

    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Ask Chip a question..." required />
      <button type="submit">Submit</button>
    </form>

    <div id="response"></div>
  </div>

  <script>
    const form = document.getElementById('chatForm');
    const input = document.getElementById('userInput');
    const responseBox = document.getElementById('response');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const question = input.value.trim();
      if (!question) return;

      responseBox.innerHTML = "<em>Thinking...</em>";

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ question })
        });

        const data = await res.json();
        responseBox.textContent = data.answer || "No response from Chip.";
      } catch (err) {
        responseBox.textContent = "Error contacting Chip.";
        console.error(err);
      }

      input.value = '';
    });
  </script>
</body>
</html>
