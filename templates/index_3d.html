<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask Chip (3D)</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #efefef;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    #container {
      background: #1c1c1c;
      width: 600px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    model-viewer {
      width: 100%;
      height: 500px;
    }

    form {
      display: flex;
      margin-top: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 4px 0 0 4px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #e65c00;
      color: white;
      font-size: 16px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }

    #response {
      color: white;
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Ask Chip (3D)</h1>
  <div id="container">
    <model-viewer src="/static/models/astronaut.glb" autoplay camera-controls auto-rotate background-color="#1c1c1c"></model-viewer>
    <form id="askForm">
      <input type="text" id="question" name="question" placeholder="Ask Chip a question..." required />
      <button type="submit">Submit</button>
    </form>
    <div id="response"></div>
  </div>

  <script>
    const form = document.getElementById("askForm");
    const responseDiv = document.getElementById("response");

    form.onsubmit = async (e) => {
      e.preventDefault();
      const question = document.getElementById("question").value;
      responseDiv.textContent = "Thinking...";

      const formData = new FormData();
      formData.append("question", question);

      const res = await fetch("/ask", {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      if (data.response && data.audio) {
        responseDiv.textContent = data.response;
        const audio = new Audio(data.audio);
        audio.play();
      } else {
        responseDiv.textContent = "Something went wrong. Try again later.";
      }
    };
  </script>
</body>
</html>
