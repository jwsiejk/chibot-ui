<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask Chip (3D)</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f3f3;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 2rem;
    }

    .container {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 600px;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      background: #1e1e1e;
      border-radius: 12px;
    }

    form {
      display: flex;
      width: 100%;
      margin-top: 15px;
    }

    input[type="text"] {
      flex-grow: 1;
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 6px 0 0 6px;
    }

    button {
      padding: 12px 20px;
      background-color: #f26c21;
      border: none;
      border-radius: 0 6px 6px 0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .output {
      margin-top: 20px;
      color: white;
      text-align: left;
      width: 100%;
    }

    audio {
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Ask Chip (3D)</h1>

  <div class="container">
    <model-viewer src="/static/models/astronaut.glb" alt="3D Chip"
      auto-rotate camera-controls disable-zoom></model-viewer>

    <form id="ask-form">
      <input type="text" id="question" name="question" placeholder="Ask Chip a question..." required />
      <button type="submit">Submit</button>
    </form>

    <div class="output" id="output"></div>
    <audio id="audio" controls style="display:none;"></audio>
  </div>

  <script>
    const form = document.getElementById("ask-form");
    const output = document.getElementById("output");
    const audio = document.getElementById("audio");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = document.getElementById("question").value;
      output.innerText = "Thinking...";
      audio.style.display = "none";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          body: new URLSearchParams({ question })
        });

        const data = await response.json();

        if (data.error) {
          output.innerText = data.error;
        } else {
          output.innerText = data.response;
          audio.src = "/" + data.audio;
          audio.style.display = "block";
          audio.play();
        }
      } catch (err) {
        output.innerText = "Something went wrong. Try again later.";
      }
    });
  </script>
</body>
</html>
