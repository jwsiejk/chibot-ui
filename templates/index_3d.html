<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask Chip (3D)</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
      text-align: center;
    }

    .container {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 700px;
      margin: auto;
      color: white;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      background-color: #1e1e1e;
    }

    #chat-form {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    #user-input {
      width: 70%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px 0 0 6px;
      border: none;
    }

    #submit-button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #f26522;
      color: white;
      border: none;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
    }

    #chip-response {
      margin-top: 20px;
      background-color: #333;
      padding: 12px;
      border-radius: 8px;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <h1>Ask Chip (3D)</h1>
  <div class="container">
    <model-viewer
      src="/static/models/chip.glb"
      alt="Chip in 3D"
      auto-rotate
      camera-controls
      exposure="1"
      shadow-intensity="1"
      environment-image="neutral">
    </model-viewer>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Ask Chip a question..." required>
      <button type="submit" id="submit-button">Submit</button>
    </form>

    <div id="chip-response"></div>
    <audio id="chip-audio" controls style="margin-top: 10px; display:none;"></audio>
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const responseBox = document.getElementById('chip-response');
    const audioPlayer = document.getElementById('chip-audio');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const prompt = input.value.trim();
      if (!prompt) return;

      responseBox.innerHTML = '<em>Chip is thinking...</em>';
      audioPlayer.style.display = 'none';

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        responseBox.textContent = data.response || 'No response received.';

        if (data.audio) {
          audioPlayer.src = data.audio;
          audioPlayer.style.display = 'block';
          audioPlayer.play();
        }
      } catch (err) {
        console.error('Error:', err);
        responseBox.textContent = 'Something went wrong. Try again later.';
      }

      input.value = '';
    });
  </script>
</body>
</html>
