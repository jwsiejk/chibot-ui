<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Ask Chip (3D)</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2em;
        }
        h1 {
            margin-bottom: 0.5em;
        }
        .container {
            background: #222;
            padding: 1em;
            border-radius: 10px;
            width: 600px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        model-viewer {
            width: 100%;
            height: 500px;
        }
        form {
            display: flex;
            margin-top: 1em;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.5em;
            border: none;
            border-radius: 5px 0 0 5px;
        }
        button {
            background-color: #f60;
            border: none;
            color: white;
            padding: 0 1em;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }
        #response {
            color: white;
            margin-top: 1em;
        }
    </style>
</head>
<body>
    <h1>Ask Chip (3D)</h1>
    <div class="container">
        <model-viewer src="/static/models/chip.glb" autoplay camera-controls background-color="#222" exposure="1" shadow-intensity="1"></model-viewer>
        <form id="chatForm">
            <input type="text" name="question" id="question" placeholder="Ask Chip a question..." required />
            <button type="submit">Submit</button>
        </form>
        <div id="response"></div>
    </div>
    <script>
        document.getElementById("chatForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const question = document.getElementById("question").value;
            const formData = new FormData();
            formData.append("question", question);
            
            const resDiv = document.getElementById("response");
            resDiv.textContent = "Thinking...";

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                if (data.error) {
                    resDiv.textContent = data.error;
                } else {
                    resDiv.textContent = data.response;
                    const audio = new Audio(data.audio);
                    audio.play();
                }
            } catch (err) {
                resDiv.textContent = "Error talking to Chip.";
            }
        });
    </script>
</body>
</html>
