<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask Chip (3D)</title>
  <style>
    body {
      background-color: #f3f3f3;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      color: #111;
    }

    a {
      text-decoration: none;
      color: #f26722;
      font-size: 14px;
      margin: 0 10px;
    }

    #container {
      width: 700px;
      margin: 20px auto;
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    model-viewer {
      width: 100%;
      height: 500px;
      background-color: #1e1e1e;
    }

    form {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    input[type="text"] {
      width: 75%;
      padding: 12px;
      border: none;
      border-radius: 6px 0 0 6px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 12px 24px;
      background-color: #f26722;
      color: white;
      border: none;
      border-radius: 0 6px 6px 0;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #d15512;
    }

    #response {
      color: white;
      margin-top: 20px;
      font-size: 16px;
      min-height: 40px;
    }

    audio {
      margin-top: 10px;
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <h1>Ask Chip (3D)</h1>
  <p>
    <a href="/profile">View Your Profile</a> |
    <a href="/logout">Logout</a>
  </p>

  <div id="container">
    <model-viewer
      id="chip-model"
      src="/static/models/chip.glb"
      alt="Chip the Virtual Engineer"
      autoplay
      auto-rotate
      camera-controls
      background-color="#1e1e1e">
    </model-viewer>

    <form id="chat-form">
      <input type="text" id="question" name="question" placeholder="Ask Chip a question..." required />
      <input type="hidden" name="name" value="User" />
      <input type="hidden" name="role" value="engineer" />
      <input type="hidden" name="region" value="NA" />
      <button type="submit">Submit</button>
    </form>

    <div id="response"></div>
    <audio id="audio" controls style="display:none;"></audio>
  </div>

  <script>
    // Pre-fill fields from URL parameters if available
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      if (params.has("name")) {
        document.querySelector("input[name='name']").value = params.get("name");
      }
      if (params.has("role")) {
        document.querySelector("input[name='role']").value = params.get("role");
      }
      if (params.has("region")) {
        document.querySelector("input[name='region']").value = params.get("region");
      }
    });

    document.getElementById("chat-form").addEventListener("submit", async function(event) {
      event.preventDefault();

      const formData = new URLSearchParams();
      formData.append("question", document.getElementById("question").value);
      formData.append("name", document.querySelector("input[name='name']").value);
      formData.append("role", document.querySelector("input[name='role']").value);
      formData.append("region", document.querySelector("input[name='region']").value);

      const responseDiv = document.getElementById("response");
      const audioPlayer = document.getElementById("audio");

      responseDiv.textContent = "Thinking...";
      audioPlayer.style.display = "none";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.error) {
          responseDiv.textContent = data.error;
        } else {
          responseDiv.textContent = data.response;
          audioPlayer.src = data.audio;
          audioPlayer.style.display = "block";
          audioPlayer.play();
        }
      } catch (err) {
        responseDiv.textContent = "Something went wrong. Try again later.";
        console.error(err);
      }
    });
  </script>
</body>
</html>
