<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask Chip (3D)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eee;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      text-align: center;
      margin-top: 30px;
    }
    #container {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
      width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #model-viewer {
      width: 100%;
      height: 600px;
    }
    form {
      margin-top: 20px;
      display: flex;
      width: 100%;
    }
    input[type="text"] {
      flex-grow: 1;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 5px 0 0 5px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      background-color: #e65c00;
      color: white;
      border-radius: 0 5px 5px 0;
      cursor: pointer;
    }
    #response {
      margin-top: 20px;
      color: white;
      font-size: 16px;
    }
    audio {
      margin-top: 10px;
      width: 100%;
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <h1>Ask Chip (3D)</h1>

  <div id="container">
    <model-viewer id="model-viewer" src="/static/models/astronaut.glb" alt="3D Chip" auto-rotate camera-controls background-color="#1a1a1a"></model-viewer>

    <form id="ask-form">
      <input type="text" name="question" id="question" placeholder="Ask Chip a question..." required>
      <button type="submit">Submit</button>
    </form>

    <div id="response"></div>
    <audio id="audio" controls style="display: none;"></audio>
  </div>

  <script>
    document.getElementById('ask-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const question = document.getElementById('question').value;
      const responseDiv = document.getElementById('response');
      const audioPlayer = document.getElementById('audio');

      responseDiv.textContent = "Thinking...";
      audioPlayer.style.display = "none";
      audioPlayer.src = "";

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ question })
        });

        const data = await res.json();

        if (data.error) {
          responseDiv.textContent = data.error;
        } else {
          responseDiv.textContent = data.response;
          audioPlayer.src = '/' + data.audio;
          audioPlayer.style.display = "block";
          audioPlayer.play();
        }
      } catch (err) {
        responseDiv.textContent = "Error contacting Chip.";
      }
    });
  </script>
</body>
</html>
