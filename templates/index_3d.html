<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ask Chip (3D)</title>
  <style>
    body {
      background-color: #efefef;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 20px;
      font-size: 2rem;
    }
    .container {
      background-color: #222;
      padding: 20px;
      border-radius: 12px;
      margin-top: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    canvas {
      width: 512px;
      height: 512px;
      display: block;
      margin: auto;
    }
    .form-row {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background-color: #e75c00;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .error-message {
      color: #ff6666;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Ask Chip (3D)</h1>
  <div class="container">
    <div id="viewer" style="width: 512px; height: 512px;"></div>

    <form id="ask-form" class="form-row">
      <input type="text" id="question" placeholder="Ask Chip a question..." required />
      <button type="submit">Submit</button>
    </form>

    <p id="error-message" class="error-message"></p>
    <audio id="audio" src="" hidden></audio>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';

    // Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(512, 512);
    document.getElementById('viewer').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.4);
    scene.add(light);

    const loader = new GLTFLoader();
    loader.load('/static/models/chip.glb', function (gltf) {
      const model = gltf.scene;
      scene.add(model);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>

  <script>
    const form = document.getElementById("ask-form");
    const audio = document.getElementById("audio");
    const errorMessage = document.getElementById("error-message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMessage.textContent = "";

      const question = document.getElementById("question").value;

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ question }),
        });

        const data = await response.json();

        if (response.ok) {
          audio.src = data.audio_url;
          audio.play();
        } else {
          errorMessage.textContent = data.error || "Something went wrong.";
        }
      } catch (err) {
        errorMessage.textContent = "Request failed. Try again later.";
      }
    });
  </script>
</body>
</html>
