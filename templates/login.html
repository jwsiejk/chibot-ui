<html><head><meta charset="utf-8"><title>Login</title></head>
<body>
  <form id="f" style="margin:2rem;font-family:system-ui">
    <input name="email" placeholder="email" style="padding:.5rem" />
    <button type="submit" style="padding:.5rem 1rem">Login</button>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = e.target.email.value.trim();
      const r = await fetch('/api/v1/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})
      });
      if (!r.ok){ alert('login failed'); return; }
      // Check profile status and route accordingly
      try{
        const me = await fetch('/api/v1/auth/me', {credentials:'include'}).then(r=>r.json());
        if (me?.profile_complete === false) location.href = '/profile'; else location.href = '/';
      }catch(_){ location.href = '/'; }
    });
  </script>
</body></html>
