<!doctype html>
<html><head>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" /><meta charset="utf-8"><title>Login</title></head>
<body>
  <form id="f" style="margin:2rem;font-family:system-ui">
    <input name="email" placeholder="email" style="padding:.5rem" />
    <button type="submit" style="padding:.5rem 1rem">Login</button>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = e.target.email.value.trim();
      const r = await fetch('/api/v1/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})});
      if (r.ok) location.href='/api/v1/admin/logs-ui'; else alert('login failed');
    });
  </script>
</body></html>
