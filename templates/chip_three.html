<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chip 3D with Viseme Animation</title>
  <style>
    body { margin: 0; background-color: #1e1e1e; }
    canvas { display: block; }
    #recordBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 10px 20px;
      font-size: 16px;
      background-color: orange;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="recordBtn">🎤 Ask Chip</button>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let model, visemeMap, skinnedMesh;
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 2.5);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x1e1e1e);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.update();

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(2, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    const loader = new GLTFLoader();
    loader.load('/static/models/chip.glb', gltf => {
      model = gltf.scene;
      model.scale.set(1, 1, 1);
      scene.add(model);

      skinnedMesh = model.getObjectByProperty('type', 'SkinnedMesh');
      if (!skinnedMesh || !skinnedMesh.morphTargetDictionary) {
        console.warn('No morph targets found on SkinnedMesh.');
        return;
      }

      visemeMap = skinnedMesh.morphTargetDictionary;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    animate();

    // 🔴 Record + stream to /ask-chip
    document.getElementById("recordBtn").addEventListener("click", async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const recorder = new MediaRecorder(stream);
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: 'audio/webm' });
        const formData = new FormData();
        formData.append("audio", blob, "input.webm");

        const response = await fetch("/ask-chip", { method: "POST", body: formData });
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let visemes = [];
        let audioUrl = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const text = decoder.decode(value);
          const lines = text.split("--frame").filter(Boolean);

          for (const line of lines) {
            const [, headers, content] = line.split(/\r?\n\r?\n/);
            if (!headers || !content) continue;

            const contentType = headers.match(/Content-Type: (.+)/)?.[1];
            if (contentType === "application/json") {
              const data = JSON.parse(content);
              if (data.viseme_timestamps) visemes = data.viseme_timestamps;
              if (data.audio) audioUrl = data.audio;
            }
          }
        }

        if (audioUrl && visemes.length && skinnedMesh) {
          const audio = new Audio(audioUrl);
          audio.play();

          visemes.forEach(({ time, viseme }, i) => {
            const delay = time * 1000;
            const targetName = `viseme_${viseme}`;
            const index = visemeMap[targetName];
            if (index === undefined) return;
            setTimeout(() => {
              skinnedMesh.morphTargetInfluences.fill(0);
              skinnedMesh.morphTargetInfluences[index] = 1;
            }, delay);

            // clear after 120ms
            setTimeout(() => {
              skinnedMesh.morphTargetInfluences[index] = 0;
            }, delay + 120);
          });
        }
      };

      recorder.start();
      setTimeout(() => recorder.stop(), 5000);
    });
  </script>
</body>
</html>
