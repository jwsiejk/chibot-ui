<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Call Log</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#0f1115; color:#e6e6e6; margin:20px; }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { font-weight: 600; }
    .bar { display:flex; gap:12px; align-items:center; margin-bottom:14px; }
    .pill { padding:3px 10px; border-radius:999px; background:#2c3446; display:inline-block; font-size:12px; }
    .error { background:#a33; }
    .log { background:#1a1f2b; border-radius:14px; padding:14px; max-height:70vh; overflow:auto; }
    .row { display:grid; grid-template-columns: 210px 220px 1fr; gap:12px; padding:8px 10px; border-bottom:1px solid #2a3142; }
    .row:nth-child(odd) { background:#161b24; }
    .ts { font-family: ui-monospace, Menlo, Consolas, monospace; opacity:.9; }
    .kind { font-weight:600; }
    .msg  { white-space: pre-wrap; word-break: break-word; }
    a { color:#8ab4f8; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Admin Call Log</h1>
  <div class="bar">
    <span class="pill">Live</span>
    <em>Only visible to admins.</em>
    <a class="pill" href="/api/health">API Health</a>
    <button id="clear">Clear Log</button>
  </div>
  <div id="log" class="log"></div>
</div>
<script>
  const el = document.getElementById('log');
  function addRow(e) {
    const row = document.createElement('div');
    row.className = 'row';
    const extra = Object.assign({}, e);
    delete extra.ts; delete extra.kind; delete extra.msg;
    const extras = Object.keys(extra).length ? ' — ' + JSON.stringify(extra) : '';
    row.innerHTML = `
      <div class="ts">${e.ts}</div>
      <div class="kind">${e.kind}</div>
      <div class="msg">${(e.msg||'')}${extras}</div>
    `;
    el.prepend(row);
  }

  // Load recent
  fetch('/admin/calls/recent?limit=200').then(r => r.json()).then(j => {
    if (j && j.items) j.items.forEach(addRow);
  });

  // SSE stream
  const evt = new EventSource('/admin/stream');
  evt.onmessage = (ev) => {
    try { addRow(JSON.parse(ev.data)); } catch {}
  };

  // Clear
  document.getElementById('clear').onclick = async () => {
    if (!confirm('Clear call log?')) return;
    await fetch('/admin/calls/clear', {method:'POST'});
    el.innerHTML = '';
  };
</script>
</body>
</html>
