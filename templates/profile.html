<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskChip — Profile</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="page">
  <header class="toolbar">
    <a href="/" class="brand">⟵ Back</a>
    <h1>Profile</h1>
  </header>
  <section class="card">
    <div class="grid">
      <label>Name<input id="prof_name"/></label>
      <label>Email<input id="prof_email" disabled/></label>
      <label>Role<input id="prof_role"/></label>
      <label>Region<input id="prof_region"/></label>
      <label>Company<input id="prof_company"/></label>
    </div>
    <div class="actions">
      <button id="profileSave" class="primary">Save</button>
      <a class="ghost" href="/">Cancel</a>
    </div>
    <div id="profileMsg" class="msgline"></div>
  </section>

  {% set asset_ver = asset_version('js/bootstrap.js') %}
  <script
    type="module"
    src="{{ url_for('static', filename='js/auth_gate.js') }}?v={{ asset_ver }}"
  ></script>
  <script type="module">
    import { prefillProfile, saveProfile } from '{{ url_for('static', filename='js/auth_gate.js') }}?v={{ asset_ver }}';
    document.addEventListener('DOMContentLoaded', async ()=>{
      await prefillProfile();
      document.getElementById('profileSave').addEventListener('click', saveProfile);
    });
  </script>
  <script
    type="module"
    src="{{ url_for('static', filename='js/askchip_client_hooks.js') }}?v={{ asset_ver }}"
  ></script>
  <script
    type="module"
    src="{{ url_for('static', filename='js/bootstrap.js') }}?v={{ asset_ver }}"
  ></script>
  <script
    type="module"
    src="{{ url_for('static', filename='js/auth_gate.js') }}?v={{ asset_ver }}"
  ></script>
</body>
</html>
