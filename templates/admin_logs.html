<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskChip — Real-Time Call Log</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="page">
  <header class="toolbar">
    <a href="/" class="brand">⟵ Back</a>
    <h1>Real-Time Call Log</h1>
  </header>
  <section class="card">
    <pre id="log" class="log"></pre>
  </section>
  <script type="module">
    const log = document.getElementById('log');
    try{
      const sse = new EventSource('/api/v1/admin/logs', { withCredentials:true });
      sse.onmessage = (e)=>{ log.textContent += e.data + "\n"; log.scrollTop = log.scrollHeight; };
      sse.onerror = ()=>{ log.textContent += "SSE error (maybe 403 — admin only).\n"; };
    }catch(e){
      log.textContent = 'Unable to open SSE: ' + e.message;
    }
  </script>
</body>
</html>
