<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskChip — Real-Time Call Log</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="page">
  <header class="toolbar">
    <a href="/" class="brand">⟵ Back</a>
    <h1>Real-Time Call Log</h1>
  </header>
  <section class="card">
    <pre id="log" class="log"></pre>
  </section>
  <script type="module">
    const log = document.getElementById('log');
    let lastStep = 0;
    async function poll(){
      const params = new URLSearchParams();
      if (lastStep) params.set('after', String(lastStep));
      const url = params.toString() ? `/api/v1/admin/logs?${params.toString()}` : '/api/v1/admin/logs';
      try {
        const resp = await fetch(url, { credentials:'include' });
        if (resp.status === 403) {
          log.textContent += 'Access denied (admin only).\n';
          return 5000;
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const payload = await resp.json();
        const events = Array.isArray(payload?.events) ? payload.events : [];
        if (!events.length && !lastStep) {
          lastStep = Number(payload?.latest_step || 0) || 0;
        }
        for (const evt of events) {
          const step = Number(evt?.step || 0);
          if (step > lastStep) lastStep = step;
          log.textContent += JSON.stringify(evt) + "\n";
        }
        if (events.length) log.scrollTop = log.scrollHeight;
        return events.length ? 250 : 1200;
      } catch (err) {
        log.textContent += `poll error: ${err?.message || err}\n`;
        return 2000;
      }
    }

    (async function loop(){
      while(true){
        const delayMs = await poll();
        await new Promise(r => setTimeout(r, delayMs || 900));
      }
    })();
  </script>
</body>
</html>
